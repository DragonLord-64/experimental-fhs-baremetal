---
- name: Check repository signing key
  ansible.builtin.stat:
    path: "{{ apt_repo_keyring }}"
  register: apt_repo_keyring_status
  tags: [apt_repo, config]

- name: Validate repository signing key
  ansible.builtin.assert:
    that:
      - apt_repo_keyring_status.stat.exists
    fail_msg: >-
      The repository signing key does not exist at {{ apt_repo_keyring }}.
      Ensure the ubuntu-keyring package is installed.
  tags: [apt_repo, config]

- name: Configure apt source (deb822)
  ansible.builtin.template:
    src: fhs.sources.j2
    dest: "{{ apt_repo_sources_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: fhs apt repo changed
  tags: [apt_repo, config]

- name: Configure apt proxy
  ansible.builtin.template:
    src: 00aptproxy.j2
    dest: "{{ apt_repo_conf_dir }}/00aptproxy"
    owner: root
    group: root
    mode: "0644"
  when: apt_cache_url | length > 0
  notify: fhs apt repo changed
  tags: [apt_repo, config]

- name: Remove apt proxy configuration when disabled
  ansible.builtin.file:
    path: "{{ apt_repo_conf_dir }}/00aptproxy"
    state: absent
  when: apt_cache_url | length == 0
  notify: fhs apt repo changed
  tags: [apt_repo, config]

- name: Remove insecure apt settings
  ansible.builtin.file:
    path: "{{ apt_repo_conf_dir }}/99allow-insecure"
    state: absent
  notify: fhs apt repo changed
  tags: [apt_repo, config]

- name: Remove disabled TLS verification setting
  ansible.builtin.file:
    path: "{{ apt_repo_conf_dir }}/99ignore-ssl"
    state: absent
  notify: fhs apt repo changed
  tags: [apt_repo, config]

- name: Configure apt disable cnf
  ansible.builtin.template:
    src: 99disable-cnf.j2
    dest: "{{ apt_repo_conf_dir }}/99disable-cnf"
    owner: root
    group: root
    mode: "0644"
  notify: fhs apt repo changed
  tags: [apt_repo, config, insecure]

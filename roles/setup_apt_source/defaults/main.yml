---
# APT repository consumed through apt-cacher-ng.
apt_repo_url: ""
apt_repo_url_base: ""
apt_repo_host_name: ""
# Release codename (e.g. noble) and component list to enable.
apt_repo_release: "{{ ansible_distribution_release | default('noble') }}"
apt_repo_components:
  - main
  - universe
apt_repo_suites:
  - noble
  - noble-updates
  - noble-security
  - noble-backports

# URL of the apt-cacher-ng service used by offline hosts.
apt_cache_url: ""

# Local naming.
apt_repo_name: fhs
apt_repo_keyring: /usr/share/keyrings/ubuntu-archive-keyring.gpg
apt_repo_sources_file: /etc/apt/sources.list.d/fhs.sources
apt_repo_conf_dir: /etc/apt/apt.conf.d/

# Run `apt update` after a config change. Disable in tests or when the
# repository isn't reachable from the converge host.
apt_repo_run_update: true

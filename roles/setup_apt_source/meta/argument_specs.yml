---
argument_specs:
  main:
    short_description: Configure an APT source and apt-cacher-ng
    options:
      apt_repo_url:
        type: str
        required: true
      apt_repo_url_base:
        type: str
      apt_repo_host_name:
        type: str
      apt_repo_release:
        type: str
      apt_repo_components:
        type: list
        elements: str
      apt_repo_suites:
        type: list
        elements: str
      apt_cache_url:
        type: str
        required: false
      apt_repo_name:
        type: str
      apt_repo_keyring:
        type: str
      apt_repo_sources_file:
        type: path
      apt_repo_conf_dir:
        type: path
      apt_repo_run_update:
        type: bool
        default: true

---
# roles/fhs_node_setup/tasks/install-containerd.yml
# Install and configure containerd runtime

- name: Install containerd prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Install Docker GPG file for Ubuntu 24.04
  ansible.builtin.copy:
    src: docker-archive-keyring.gpg
    dest: /usr/share/keyrings/docker-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu noble stable"
    state: present

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_pkg_version }}"
    state: present
    update_cache: true

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_config
  changed_when: false

- name: Check generated containerd cgroup setting
  ansible.builtin.assert:
    that:
      - "'SystemdCgroup = false' in containerd_config.stdout or 'SystemdCgroup = true' in containerd_config.stdout"
    fail_msg: Review the pinned containerd default configuration before applying.

- name: Write final containerd configuration
  ansible.builtin.copy:
    content: "{{ containerd_config.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Restart containerd

- name: Ensure containerd is running
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

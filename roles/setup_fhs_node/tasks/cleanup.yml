---
# roles/fhs_node_setup/tasks/cleanup.yml
# Uninstall Kubernetes

- name: Reset existing Kubernetes installation
  ansible.builtin.command: kubeadm reset -f
  register: kube_reset
  failed_when: false
  changed_when: "'No active cluster' not in kube_reset.stderr"
  become: true

- name: Unhold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ k8s_packages }}"
  become: true

- name: Remove Kubernetes packages
  ansible.builtin.apt:
    name: "{{ k8s_packages }}"
    state: absent
    purge: true
  become: true

- name: Remove Kubernetes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /var/lib/etcd
    - /var/lib/kubelet
  become: true

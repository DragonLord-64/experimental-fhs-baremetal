---
# systemd-networkd config directory.
network_dir: /etc/systemd/network

# Primary FHS NIC (matched by MAC address from inventory).
# sys_mac_address and ansible_host are expected from host_vars.
network_interface_prefix: "16"
network_dns:
  - 172.17.0.95
  - 192.168.128.13
network_ntp:
  - 192.168.1.6
  - 192.168.1.7

network_domains: []

# Disable cloud-init's network management.
network_disable_cloud_init: true
network_cloud_init_config_dir: /etc/cloud/cloud.cfg.d
network_remove_legacy_netplan: false
network_legacy_netplan_file: /etc/netplan/50-cloud-init.yaml

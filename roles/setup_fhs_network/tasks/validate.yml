---
- name: Validate primary network inputs before writes
  ansible.builtin.assert:
    that:
      - sys_mac_address | default('') is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
      - ansible_host | default('') is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
      - ansible_host.split('.') | map('int') | select('gt', 255) | list | length == 0
      - network_interface_prefix | string is match('^([0-9]|[12][0-9]|3[0-2])$')
      - network_dns | length > 0
      - network_ntp | length > 0
    fail_msg: Supply a valid primary MAC, IPv4 address, prefix (0–32), DNS and NTP before applying networking.

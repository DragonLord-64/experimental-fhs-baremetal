---
- name: Check required network inputs
  ansible.builtin.import_tasks: validate.yml

- name: Configure network files
  ansible.builtin.import_tasks: configure.yml

- name: Install DNS and time services
  ansible.builtin.apt:
    name: [systemd-resolved, systemd-timesyncd]
    state: present

- name: Ensure timesyncd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: Configure authorized NTP servers
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/00-fhs.conf
    mode: "0644"
  notify: Restart systemd-timesyncd

- name: Use resolved stub resolver
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true

- name: Enable network DNS and time services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [systemd-networkd, systemd-resolved, systemd-timesyncd]

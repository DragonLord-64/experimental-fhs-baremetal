---
# tasks file for bittware_sdk
- name: FPGA host packages + group
  ansible.builtin.import_tasks: packages.yml

- name: Bittware SDK
  ansible.builtin.import_tasks: bittware_sdk.yml
  when: fpga_update_bittware_sdk | bool

- name: Bittware venvs
  ansible.builtin.import_tasks: bittware_venvs.yml
  when: users_setup_venvs | bool



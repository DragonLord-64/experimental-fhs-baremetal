---
- name: Check whether Bittware SDK is installed
  ansible.builtin.stat:
    path: "{{ fpga_bittware_sdk_root }}/scripts/bw_pip.py"
  register: fpga_sdk_root_stat

- name: Select BittWare venvs
  ansible.builtin.set_fact:
    bw_venvs: "{{ venvs | selectattr('group', 'defined') | selectattr('group', 'equalto', fpga_bittware_group) | list }}"

- name: Bail out early when there are no bittware venvs
  ansible.builtin.debug:
    msg: "No venvs owned by group {{ fpga_bittware_group }} – nothing to install."
  when: bw_venvs is not defined or bw_venvs | length == 0

# Each task below runs as the target user so files inside the venv end
# up owned correctly without a recurse-chown that breaks idempotence.
- name: Set up Bittware SDK in venvs
  when: bw_venvs | length > 0
  block:

    - name: Install packaging into each bittware venv
      ansible.builtin.pip:
        name: packaging
        virtualenv: "{{ item.path }}"
        state: present
      become: true
      become_user: "{{ item.owner | default('root') }}"
      loop: "{{ bw_venvs }}"
      loop_control:
        label: "{{ item }}"

    - name: Install Bittware SDK Python package into each bittware venv
      ansible.builtin.command:
        cmd: >-
          {{ item.path }}/bin/python3
          {{ fpga_bittware_sdk_root }}/scripts/bw_pip.py install
        creates: "{{ item.path }}/bin/bw_card_monitor"
      environment:
        BWSDK_ROOT: "{{ fpga_bittware_sdk_root }}"
      become: true
      become_user: "{{ item.owner | default('root') }}"
      loop: "{{ bw_venvs }}"
      loop_control:
        label: "{{ item }}"
      when: fpga_sdk_root_stat.stat.exists

    - name: Restore shared venv permissions after SDK package installation
      ansible.builtin.include_role:
        name: manage_venvs
        tasks_from: permissions
      vars:
        venvs: "{{ bw_venvs }}"

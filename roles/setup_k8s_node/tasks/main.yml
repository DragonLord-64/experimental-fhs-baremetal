---
# roles/setup_k8s_node/tasks/main.yml

- name: Validate node preparation inputs
  ansible.builtin.import_tasks: validate.yml

- name: Cleanup previous Kubernetes installation
  ansible.builtin.import_tasks: cleanup.yml
  tags: [cleanup, never]
  when: "'cleanup' in ansible_run_tags"

- name: Configure pre-requisites
  ansible.builtin.import_tasks: prereqs.yml

- name: Install containerd
  ansible.builtin.include_tasks: install-containerd.yml

- name: Install kubeadm, kubelet, and kubectl
  ansible.builtin.include_tasks: install-k8s-packages.yml

- name: Create kubeadm directory
  ansible.builtin.file:
    path: /etc/kubernetes/kubeadm
    state: directory
    mode: "0755"

- name: Render template and copy directly to remote nodes
  ansible.builtin.template:
    src: kubeadm-join.yaml.j2
    dest: /etc/kubernetes/kubeadm/kubeadm-join.yaml
    mode: "0600"

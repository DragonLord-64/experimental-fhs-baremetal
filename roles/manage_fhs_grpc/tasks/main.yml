---
- name: Normalize NetBox tag slugs
  ansible.builtin.set_fact:
    _grpc_tags: "{{ (tags | default([]) | select('string') | list) + (tags | default([]) | reject('string') | map(attribute='slug') | list) }}"

- name: Reject conflicting controller tags before writes
  ansible.builtin.assert:
    that: not ('grpc-fsp' in _grpc_tags and 'grpc-vcc' in _grpc_tags)
    fail_msg: Select only one of grpc-fsp and grpc-vcc.

- name: Install selected controller
  ansible.builtin.include_tasks: install.yml
  vars:
    _grpc_kind: "{{ 'fsp' if 'grpc-fsp' in _grpc_tags else 'vcc' }}"
    _grpc_config: "{{ manage_grpc_controllers[_grpc_kind] }}"
    _grpc_project: "{{ manage_grpc_root }}/{{ _grpc_kind }}/{{ _grpc_config.controller }}"
    _grpc_other: "{{ 'vcc' if _grpc_kind == 'fsp' else 'fsp' }}"
  when: "'grpc-fsp' in _grpc_tags or 'grpc-vcc' in _grpc_tags"

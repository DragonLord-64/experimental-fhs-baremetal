---
# Review note: compare exact config bytes and metadata independently of the template;
# managed-header comment wrappers vary with Ansible and are not pip configuration.
- name: Verify baseline pip state
  hosts: all
  gather_facts: false
  tasks:
    - name: Read pip config
      ansible.builtin.slurp:
        src: /etc/pip.conf
      register: pipconf
    - name: Read config metadata
      ansible.builtin.stat:
        path: /etc/pip.conf
      register: pipstat
    - name: Read unrelated fixture
      ansible.builtin.slurp:
        src: /etc/pip-unrelated.fixture
      register: unrelated
    - name: Assert exact state and preserved canary
      ansible.builtin.assert:
        that:
          # Review note: require a comment-only header and exact remaining bytes; expose safe fixture bytes on failure.
          - (pipconf.content | b64decode).startswith('#')
          - (pipconf.content | b64decode | regex_replace('(?m)^#[^\n]*\n', '')) == "[global]\nindex-url = https://index.test.invalid/simple/\ntrusted-host = index.test.invalid mirror.test.invalid\n"
          - pipstat.stat.uid == 0
          - pipstat.stat.gid == 0
          - pipstat.stat.mode == '0644'
          - (unrelated.content | b64decode) == "preserve unrelated pip fixture\n"
        fail_msg: "Unexpected disposable fixture state: {{ pipconf.content | b64decode | to_json }}; metadata={{ pipstat.stat.mode }}/{{ pipstat.stat.uid }}/{{ pipstat.stat.gid }}"

---
# Review note: use explicit owned-container lifecycle playbooks, avoiding privileged Docker defaults.
role_name_check: 0
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
platforms:
  - name: "${FHS_MOLECULE_NAME}"
provisioner:
  name: ansible
  # Review note: connect only to this run's named Docker container; never a host inventory.
  inventory:
    host_vars:
      "${FHS_MOLECULE_NAME}":
        ansible_connection: community.docker.docker
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
# Review note: idempotence is followed by observed policy/drift checks before owned teardown.
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - idempotence
    - verify
    - destroy

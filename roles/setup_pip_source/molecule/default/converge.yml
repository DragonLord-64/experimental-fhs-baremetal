---
# Review note: mirror site.yml dynamic role/apply tags with reserved fixture URLs only.
- name: Converge actual setup_pip_source
  hosts: all
  gather_facts: false
  vars:
    pip_index_url: https://index.test.invalid/simple/
    pip_trusted_hosts: [index.test.invalid, mirror.test.invalid]
  tasks:
    - name: Apply setup_pip_source
      ansible.builtin.include_role:
        name: setup_pip_source
        apply:
          tags: [setup_pip_source]
      tags: [setup_pip_source]

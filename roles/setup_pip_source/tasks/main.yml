---
- name: Validate pip index URL
  ansible.builtin.assert:
    that:
      - pip_index_url | length > 0
    fail_msg: "Set pip_index_url to the devpi +simple index URL."
  tags: [pip_index, config]

- name: Write system pip.conf
  ansible.builtin.template:
    src: pip.conf.j2
    dest: "{{ pip_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: [pip_index, config]

---
- name: Validate pip index URL
  ansible.builtin.assert:
    that:
      - pip_index_url | length > 0
      - pip_index_url is match('^https://') or (pip_allow_insecure_http | bool and pip_index_url is match('^http://'))
      - pip_trusted_hosts | length == 0 or pip_allow_insecure_http | bool
    fail_msg: >-
      Set pip_index_url to the HTTPS devpi +simple URL and trust its issuing CA
      through system trust or pip_ca_bundle. Leave pip_trusted_hosts empty for
      verified HTTPS. Isolated HTTP compatibility requires explicit
      pip_allow_insecure_http=true.

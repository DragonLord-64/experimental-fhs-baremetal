---
- name: Read account inputs
  ansible.builtin.import_tasks: inputs.yml

- name: Create accounts and configure access
  ansible.builtin.import_tasks: accounts.yml

- name: Install the system SDK prerequisite
  ansible.builtin.import_tasks: sdk.yml
  when: fhs_setup_user_environments | bool

- name: Create shared and personal BittWare environments
  ansible.builtin.import_tasks: environments.yml
  when: fhs_setup_user_environments | bool

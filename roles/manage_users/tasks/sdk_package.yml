---
- name: Validate selected SDK package
  ansible.builtin.import_tasks: sdk_inputs.yml

- name: Gather installed apt packages
  ansible.builtin.package_facts:
    manager: apt

- name: Compute installed SDK version
  ansible.builtin.set_fact:
    fpga_installed_sdk_version: >-
      {{ ansible_facts.packages[fpga_bittware_sdk_package][0].version
         if (fpga_bittware_sdk_package in ansible_facts.packages) else '' }}

- name: Copy SDK deb to target
  ansible.builtin.copy:
    src: "{{ fpga_bittware_sdk_deb }}"
    dest: "/var/cache/apt/archives/{{ fpga_bittware_sdk_deb | basename }}"
    owner: root
    group: root
    mode: "0644"
  when: fpga_installed_sdk_version != sdk_deb_version.stdout

- name: Install Bittware SDK
  ansible.builtin.apt:
    deb: "/var/cache/apt/archives/{{ fpga_bittware_sdk_deb | basename }}"
    state: present
    dpkg_options: 'force-confold,force-confdef'
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: fpga_installed_sdk_version != sdk_deb_version.stdout

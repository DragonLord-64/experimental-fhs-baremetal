---
# Additional human/service accounts; public-key filenames also create accounts.
fhs_users: []
fhs_keys_dir: ""
# Default human groups; explicit service users default to BittWare only.
fhs_user_groups:
  - sudo
  - "{{ fhs_bittware_group }}"

# Sudoers policy drop-in, mode 0440 and checked with visudo.
fhs_sudoers_file: /etc/sudoers.d/99-fhs-passwordless
# Only controller-approved key-file accounts receive development passwordless sudo.
# Production inventories leave this false; existing group memberships are preserved.
fhs_development_passwordless_sudo: false
fhs_sudoers_content: |
  # Managed FHS development policy
  {% if fhs_development_passwordless_sudo | bool %}
  {% for name in fhs_key_usernames | sort %}
  {% if name not in (fhs_users | selectattr('system', 'defined') | selectattr('system') | map(attribute='name') | list) %}
  {{ name }} ALL=(ALL) NOPASSWD:ALL
  {% endif %}
  {% endfor %}
  {% endif %}

# Shared identity used by the SDK and runner roles as well.
fhs_bittware_group: bittware
fhs_bittware_group_gid: 666

# Shared and per-account SDK environments.
fhs_setup_user_environments: true
fhs_user_venv_name: .bw_venv
fhs_shared_venv_path: /opt/venvs/fhs
fhs_shared_venv_owner: root
fhs_venv_python: /usr/bin/python3
fhs_venv_packages: [pip, setuptools, wheel, packaging]
fpga_bittware_sdk_deb: ""
fpga_bittware_sdk_package: bittware-sdk
fpga_bittware_sdk_root: /usr/share/bittware-sdk
fpga_update_bittware_sdk: false
fpga_apt_packages: [python3, python3-pip, python3-venv, udev, libusb-1.0-0, libffi-dev]

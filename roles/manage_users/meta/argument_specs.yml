---
argument_specs:
  main:
    short_description: Configure FHS accounts and BittWare virtual environments
    options:
      fhs_users:
        type: list
        elements: dict
        default: []
        options:
          name: {type: str, required: true}
          password: {type: str, no_log: true}
          group: {type: str}
          groups: {type: list, elements: str}
          system: {type: bool, default: false}
          home: {type: path}
          shell: {type: path}
          ssh_keys: {type: list, elements: str, default: []}
      fhs_keys_dir: {type: path, default: ""}
      fhs_user_groups: {type: list, elements: str, default: [sudo, bittware]}
      fhs_sudoers_file: {type: path, default: /etc/sudoers.d/99-fhs-passwordless}
      fhs_sudoers_content: {type: str}
      fhs_setup_user_environments: {type: bool, default: true}
      fhs_user_venv_name: {type: str, default: .bw_venv}
      fhs_shared_venv_path: {type: path, default: /opt/venvs/fhs}
      fhs_shared_venv_owner: {type: str, default: root}
      fhs_venv_python: {type: path, default: /usr/bin/python3}
      fhs_venv_packages: {type: list, elements: str, default: [pip, setuptools, wheel, packaging]}
      fpga_bittware_sdk_deb: {type: path, default: ""}
      fpga_update_bittware_sdk: {type: bool, default: false}

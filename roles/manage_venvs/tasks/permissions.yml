---
- name: Repair ownership and access throughout each venv
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('bittware') }}"
    # X preserves executable scripts without making ordinary data executable.
    mode: "{{ item.tree_mode | default('u=rwX,g=' ~ venv_mode_bits[(item.mode | default('0750'))[-2] | int] ~ ',o=' ~ venv_mode_bits[(item.mode | default('0750'))[-1] | int]) }}"
    recurse: true
    follow: false
  loop: "{{ venvs }}"

- name: Apply configured top-level directory mode
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ venvs }}"

#   tags: [venvs, config]

- name: Create venvs
  ansible.builtin.command:
    cmd: "{{ item.python }} -m venv {{ item.path }}"
    creates: "{{ item.path }}/bin/python"
  loop: "{{ venvs }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  become_user: "{{ item.owner | default('root') }}"
  tags: [venvs, install]

- name: Set venv directory ownership and mode
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('bittware') }}"
    mode: "{{ item.mode | default('0775') }}"
    recurse: false
  loop: "{{ venvs }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [venvs, config]

- name: Install venv packages
  ansible.builtin.pip:
    name: "{{ item.1 }}"
    virtualenv: "{{ item.0.path }}"
    state: present
  loop: "{{ venvs | subelements('packages', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.path }} :: {{ item.1 }}"
  become: true
  become_user: "{{ item.0.owner | default('root') }}"
  tags: [venvs, install]

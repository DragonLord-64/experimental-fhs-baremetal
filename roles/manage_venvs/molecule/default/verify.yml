---
- name: Verify — venvs
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat venv python
      ansible.builtin.stat:
        path: /opt/venvs/fhs/bin/python
      register: venv_python
    - name: Assert venv interpreter exists and is executable
      ansible.builtin.assert:
        that:
          - venv_python.stat.exists
          - venv_python.stat.executable
    - name: Confirm wheel installed in venv
      ansible.builtin.command: /opt/venvs/fhs/bin/python -c "import wheel"
      changed_when: false

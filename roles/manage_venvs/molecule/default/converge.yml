---
- name: Converge — venvs
  hosts: all
  become: true
  vars:
    venvs:
      - path: /opt/venvs/fhs
        python: /usr/bin/python3
        owner: root
        group: root
        mode: "0775"
        packages:
          - wheel
  tasks:
    - name: Apply venvs
      ansible.builtin.import_role:
        name: venvs

---
# List of venvs to manage. Each entry:
#   path:     /opt/venvs/foo      # required
#   python:   /usr/bin/python3.10 # required — full path
#   owner:    root                # owner of the venv directory
#   group:    bittware            # group of the venv directory
#   mode:     "0775"              # directory mode
#   packages: []                  # pip packages to install (versioned for idempotency)
venvs: []

# Apt packages required to create venvs. python3.X-venv must match the
# python interpreter used; the default covers the standard Noble setup.
venv_apt_packages:
  - python3-venv
  - python3-pip

---
argument_specs:
  main:
    short_description: Create shared Python virtual environments
    options:
      venvs:
        type: list
        elements: dict
        default: []
        options:
          path: {type: path, required: true}
          python: {type: path, required: true}
          owner: {type: str, default: root}
          group: {type: str, default: root}
          mode: {type: str, default: "0775"}
          packages: {type: list, elements: str, default: []}
      venv_apt_packages: {type: list, elements: str}

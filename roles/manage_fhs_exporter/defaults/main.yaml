manage_exporters_exporter_file: "/provision/files.d/external_archives/ska-mid-cbf-fhs-prometheus-exporter-0.0.5-rc3.tar.gz"

# Service Configuration Options
fhs_exporter_port: 9110
fhs_exporter_log_level: "DEBUG"
fhs_exporter_venv_path: "/opt/venvs/fhs-exporter"

# MFT must be supplied by the approved vendor repository/package.
fhs_exporter_apt_packages: [python3-pip, python3-venv, pciutils, sudo, ipmitool, ethtool, mft]

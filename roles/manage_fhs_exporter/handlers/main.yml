---
# Reload after the exporter unit changes
- name: Reload Systemd Daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# Restart after exporter package or unit changes
- name: Restart Exporter
  ansible.builtin.systemd_service:
    name: fhs-exporter
    state: restarted
    enabled: true
  become: true

# Rule files are useful locally only when this host runs Prometheus.
- name: Restart Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
  when: "'prometheus.service' in ansible_facts.services"

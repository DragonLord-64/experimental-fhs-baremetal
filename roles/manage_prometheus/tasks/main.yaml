- name: Require controller archive directory and package selections
  ansible.builtin.assert:
    that:
      - manage_prometheus_file_directory | length > 0
      - manage_prometheus_prometheus_tar | length > 0
      - manage_prometheus_node_tar | length > 0
    fail_msg: Set Prometheus and node exporter archive selections in monitoring group vars.

- name: Require private authentication hash when enabled
  ansible.builtin.assert:
    that:
      - not manage_prometheus_enable_auth or manage_prometheus_user_cred | length > 0
    fail_msg: Supply a private bcrypt hash when enabling authentication.
  no_log: true

- name: Verify Prometheus data retention size is under 200G
  ansible.builtin.assert:
    that:
      - (manage_prometheus_retention_size | regex_replace('[Gg][Bb]?', '') | trim | float) < 200.0
    fail_msg: "Prometheus retention size ({{ manage_prometheus_retention_size }}) must be strictly less than 200G!"
    success_msg: "Retention size validation passed."
  when: manage_prometheus_retention_size is defined

- name: Create Prometheus service user
  ansible.builtin.user:
    name: "{{ manage_prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Node Exporter service user
  ansible.builtin.user:
    name: "{{ manage_prometheus_node_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: "{{ manage_prometheus_data_dir }}"
    state: directory
    owner: "{{ manage_prometheus_user }}"
    group: "{{ manage_prometheus_user }}"
    mode: "0750"

- name: Create remote prom directory on target
  ansible.builtin.file:
    path: /usr/local/bin/prometheus/
    owner: root
    group: root
    state: directory
    mode: "0755"

- name: Copy external Prometheus version from control host to target
  ansible.builtin.unarchive:
    src: "{{ manage_prometheus_file_directory }}/{{ manage_prometheus_prometheus_tar }}.tar.gz"
    dest: /usr/local/bin/prometheus/
    remote_src: false
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart Prometheus service

- name: Set up directory for prometheus configuration
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: "{{ manage_prometheus_user }}"
    mode: "0755"

- name: Use template to add site config
  ansible.builtin.template:
    src: site.yml.j2
    dest: /etc/prometheus/site.yml
    validate: "/usr/local/bin/prometheus/{{ manage_prometheus_prometheus_tar }}/promtool check web-config %s"
    owner: root
    group: "{{ manage_prometheus_user }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart Prometheus service

- name: Load config file to target
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: "{{ manage_prometheus_user }}"
    mode: "0640"
    validate: "/usr/local/bin/prometheus/{{ manage_prometheus_prometheus_tar }}/promtool check config %s"
  notify: Restart Prometheus service

- name: Copy service file to remote systemd
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: Restart Prometheus service

- name: Copy node exporter executable from control host to target
  ansible.builtin.unarchive:
    src: "{{ manage_prometheus_file_directory }}/{{ manage_prometheus_node_tar }}.tar.gz"
    dest: /usr/local/bin/prometheus/
    remote_src: false
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart Node Exporter service

- name: Upload Node service file
  ansible.builtin.template:
    src: node.service.j2
    dest: /etc/systemd/system/node.service
    mode: "0644"
  notify: Restart Node Exporter service

- name: Apply pending monitoring changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start Prometheus service
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Enable and start Node Exporter service
  ansible.builtin.systemd_service:
    name: node
    enabled: true
    state: started
    daemon_reload: true
  become: true

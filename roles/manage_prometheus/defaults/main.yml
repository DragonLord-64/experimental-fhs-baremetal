# Controller artifact selections are required in inventory.
manage_prometheus_file_directory: ""
manage_prometheus_apt_version: ""

# Archive basenames without .tar.gz.
manage_prometheus_prometheus_tar: ""
manage_prometheus_node_tar: ""

manage_prometheus_user: prometheus
manage_prometheus_node_user: node_exporter
manage_prometheus_data_dir: /var/lib/prometheus


# Authentication Settings:
manage_prometheus_enable_auth: false
manage_prometheus_user_cred: ""

# Basic Settings:
manage_prometheus_prometheus_port: 9090
manage_prometheus_retention_size: 15GB
manage_prometheus_retention_time: 14d
manage_prometheus_scrape_interval: 15s
manage_prometheus_evaluation_interval: 15s

---
- name: Initialise reboot tracker
  ansible.builtin.set_fact:
    fpga_reboot_pending: false
  tags: [always]

- name: VFIO udev rules
  ansible.builtin.import_tasks: udev.yml

- name: GRUB kernel cmdline
  ansible.builtin.import_tasks: grub.yml
  when: fpga_update_grub | bool
  tags: [grub, destructive]


- name: BMC firmware
  ansible.builtin.import_tasks: bmc_firmware.yml
  when: fpga_update_bmc | bool and 'firmware' in ansible_run_tags
  tags: [firmware, destructive, never]


- name: Flush boot configuration handlers
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: Report pending boot configuration changes without rebooting
  ansible.builtin.debug:
    msg: Boot configuration changed; no reboot is performed by this role.
  when: fpga_reboot_pending | bool

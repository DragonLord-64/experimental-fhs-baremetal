---
- name: Require supported target OS
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Debian'
    fail_msg: Filebeat installation requires a Debian-family target.

- name: Validate publishing inputs
  ansible.builtin.import_tasks: publishing_inputs.yml

- name: Prepare Elasticsearch from the control host
  ansible.builtin.import_tasks: setup.yml
  when: filebeat_setup_enabled | bool and not ansible_check_mode
  run_once: true
  delegate_to: "{{ filebeat_setup_delegate }}"
  become: false

- name: Require journalctl for journal collection
  ansible.builtin.command:
    argv: [journalctl, --version]
  changed_when: false

- name: Copy local package to target
  ansible.builtin.copy:
    src: "{{ filebeat_package_path }}"
    dest: "{{ filebeat_remote_package_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Install local Debian package without adding repositories
  ansible.builtin.apt:
    deb: "{{ filebeat_remote_package_path }}"
    state: present
  when: ansible_facts.os_family == 'Debian'
  notify: Restart filebeat

- name: Inspect installed Filebeat version
  ansible.builtin.command:
    argv: ["{{ filebeat_binary }}", version]
  register: filebeat_installed_version
  changed_when: false
  when: not ansible_check_mode

- name: Require the selected Filebeat major version
  ansible.builtin.assert:
    that:
      - filebeat_installed_version.stdout is search('filebeat version ' ~ filebeat_expected_major_version ~ '\.')
    fail_msg: Use a Filebeat package compatible with the Elasticsearch version; this role defaults to Filebeat 9.
  when: not ansible_check_mode

- name: Ensure root-owned configuration and runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - "{{ filebeat_config_path | dirname }}"
    - "{{ filebeat_path_data }}"
    - "{{ filebeat_path_logs }}"

- name: Render and validate Filebeat configuration
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: "{{ filebeat_config_path }}"
    owner: root
    group: root
    mode: '0600'
    validate: "{{ filebeat_binary }} test config --path.home {{ filebeat_path_home }} --path.data {{ filebeat_path_data }} -c %s"
  no_log: true
  diff: false
  notify: Restart filebeat

- name: Test Elasticsearch connectivity using the deployed configuration
  ansible.builtin.command:
    argv:
      - "{{ filebeat_binary }}"
      - test
      - output
      - --path.home
      - "{{ filebeat_path_home }}"
      - --path.data
      - "{{ filebeat_path_data }}"
      - -c
      - "{{ filebeat_config_path }}"
  changed_when: false
  no_log: true
  when: filebeat_validate_output | bool and not ansible_check_mode

- name: Apply pending configuration restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start Filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    enabled: true
    state: started
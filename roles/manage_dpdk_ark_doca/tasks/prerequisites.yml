---
- name: Install System Dependencies in a Single Fast Batch
  ansible.builtin.apt:
    name: "{{ dpdk_apt_packages }}"
    state: present
    update_cache: true
  become: true

- name: Retain the Arkville automatic-allocation bypass
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: "# vm.nr_hugepages bypass for atomic rules script"
    create: true
    mode: '0644'

- name: Ensure hugepage mount directory exists
  ansible.builtin.file:
    path: "{{ fhs_hugepage_mount }}"
    state: directory
    mode: "0755"
  when: dpdk_manage_hugepages | bool

- name: Mount reserved hugepages persistently
  ansible.posix.mount:
    path: "{{ fhs_hugepage_mount }}"
    src: nodev
    fstype: hugetlbfs
    opts: "pagesize={{ fhs_hugepage_size }}"
    state: mounted
  when: dpdk_manage_hugepages | bool

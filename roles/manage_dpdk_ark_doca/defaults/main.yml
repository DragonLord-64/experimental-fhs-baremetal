---
# ==============================================================================
# Patched DPDK Infrastructure Variables
# ==============================================================================
# Local directory on your localhost engine containing the compressed source bundle
dpdk_local_path: ""
# The filename tracking your custom patched source tree
dpdk_tarball_filename: ""

# ==============================================================================
# Arkville Installation Variables
# ==============================================================================
arkville_release: ""
arkville_local_path: ""

# ==============================================================================
# NVIDIA DOCA Installation Variables
# ==============================================================================
doca_local_path: ""
doca_deb_filename: ""

# Every input change uses a full clean procedure, never partial repair.
dpdk_force_rebuild: false
dpdk_build_revision: '2'
dpdk_success_file: /var/lib/fhs/dpdk-success.sha256
dpdk_install_outputs:
  - /usr/local/bin/dpdk-testpmd
dpdk_manage_hugepages: true
fhs_hugepage_size: 1G
fhs_hugepage_count: 8
fhs_hugepage_mount: /mnt/huge_1gb

dpdk_apt_packages:
  - apt-utils
  - build-essential
  - libpcap-dev
  - numactl
  - libnuma-dev
  - linux-headers-generic
  - libboost-dev
  - zlib1g-dev
  - libboost-python-dev
  - libpci-dev
  - libyaml-dev
  - libaio-dev
  - libbsd-dev
  - libxslt-dev
  - ninja-build
  - pkg-config
  - python3-pip
  - libjsoncpp-dev
  - python3-pyelftools
  - meson
  - libpython3-dev
  - libsystemd-dev
  - python3-scapy
  - libibverbs-dev
  - librdmacm-dev

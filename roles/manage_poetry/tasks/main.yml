- name: Use forwarded pip to install poetry itself
  ansible.builtin.command:
    cmd: /opt/venvs/fhs/bin/pip install poetry
  tags: [poetry_install]

- name: Test poetry install
  ansible.builtin.command:
    cmd: /opt/venvs/fhs/bin/poetry --version
  become: true
  register: install_out
  tags: [poetry_install]


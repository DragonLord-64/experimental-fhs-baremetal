name: Focused checks
on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "CHECK_BASE=$base" >> "$GITHUB_ENV"
      - name: Source syntax and whitespace
        run: python3 ops/agent-pipeline/checks.py --base "$CHECK_BASE"
      - name: Controller tests when changed
        run: |
          if git diff --name-only "$CHECK_BASE" HEAD -- 'ops/agent-pipeline/*.py' | grep -q .; then
            python3 -m unittest discover -s ops/agent-pipeline/tests -v
          fi

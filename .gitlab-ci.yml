default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - lint
  - build
  - pages
  - scan

include:
  # Linting Playbooks
  #- project: "ska-telescope/templates-repository"
  #  file: "gitlab-ci/includes/ansible-lint.gitlab-ci.yml"
# Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'

ansible-lint:
  stage: lint
  tags:
  - ${SKA_DEFAULT_RUNNER}
  before_script:
    - '[ -f .make/ansible.mk ] || (echo "File ansible.mk not included in Makefile; exit 1")'
    - mkdir -p build/reports/
    - poetry config virtualenvs.create false
    - poetry install --no-root
  script:
    - make ansible-lint
  after_script:
    - ansible-lint-junit ansible-lint-results.txt -o build/reports/linting.xml
    - mv ansible-lint-results.txt build/
  artifacts:
    paths:
      - "build/"
    when: always
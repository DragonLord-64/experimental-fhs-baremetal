[project]
name = "ska-mid-cbf-fhs-baremetal"
version = "0.0.1"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4"
ansible = "^10.1.0"
ansible-compat = "^24.6.1"
ansible-lint = { version = "^24.6.0", markers = "platform_system != 'Windows'" }
ansible-lint-junit = { version = "^0.17.8", markers = "platform_system != 'Windows'" }

[tool.poetry.group.docs.dependencies]
sphinx = "^7"
ska-ser-sphinx-theme = "^0.2.1"
myst-parser = "^4.0.1"
sphinx_collapse = "^0.1.3"
sphinxcontrib-mermaid = "^0.9.2"
sphinxcontrib-plantuml = "^0.26"
sphinxcontrib-apidoc="^0.6.0"

[[tool.poetry.source]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.poetry.source]]
name = "PyPI-public"
url = "https://pypi.org/simple"
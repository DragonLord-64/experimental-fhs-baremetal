apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  {{- with .Values.global.ingressAnnotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName | quote }}
  {{- with .Values.global.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.global.hostname | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.global.hostname | quote }}
      http:
        paths:
          {{- if .Values.netbox.enabled }}
          - path: {{ printf "%s/netbox/" (include "fhs-platform.prefix" .) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.netbox.fullnameOverride }}
                port: {name: http}
          {{- end }}
          {{- if .Values.grafana.enabled }}
          - path: {{ printf "%s/grafana/" (include "fhs-platform.prefix" .) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.grafana.fullnameOverride }}
                port: {name: service}
          {{- end }}
          {{- if .Values.logging.kibana.enabled }}
          - path: {{ printf "%s/mid-cbf-kibana/" (include "fhs-platform.prefix" .) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "elastic-small.name" . }}-kibana
                port: {number: 5601}

          {{- end }}
          {{- if .Values.landing.enabled }}
          - path: {{ printf "%s/" (include "fhs-platform.prefix" .) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-hw-landing
                port: {name: http}
          {{- end }}

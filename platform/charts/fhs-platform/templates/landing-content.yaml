{{- if .Values.landing.enabled }}
{{- $prefix := include "fhs-platform.prefix" . }}
{{- $services := list }}
{{- if .Values.netbox.enabled }}
{{- $services = append $services (dict "id" "netbox" "name" "NetBox" "url" (printf "%s/netbox/" $prefix) "endpoint" (printf "http://%s:%v%s/netbox/login/" .Values.netbox.fullnameOverride .Values.netbox.service.port $prefix) "expected" (list 200 302)) }}
{{- end }}
{{- if .Values.grafana.enabled }}
{{- $services = append $services (dict "id" "grafana" "name" "Grafana" "url" (printf "%s/grafana/" $prefix) "endpoint" (printf "http://%s:%v%s/grafana/api/health" .Values.grafana.fullnameOverride .Values.grafana.service.port $prefix) "expected" (list 200)) }}
{{- end }}
{{- if .Values.logging.kibana.enabled }}
{{- $services = append $services (dict "id" "kibana" "name" "Kibana" "url" (printf "%s/mid-cbf-kibana/" $prefix) "endpoint" (printf "http://%s-kibana:5601%s/mid-cbf-kibana/api/status" (include "elastic-small.name" .) $prefix) "expected" (list 200 401 403)) }}
{{- end }}
{{- range .Values.landing.extraChecks }}
{{- $services = append $services . }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hw-landing
data:
  config.json: {{ dict "prefix" $prefix "services" $services "links" .Values.landing.links "introduction" .Values.landing.introduction "timeout" .Values.landing.timeoutSeconds "stale" .Values.landing.staleSeconds | toJson | quote }}
  server.py: |
{{ .Files.Get "files/landing/server.py" | indent 4 }}
{{- end }}

{{- if .Values.credentials.create -}}
{{- $name := "fhs-platform-credentials" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and .Release.IsUpgrade (not $existing) -}}
{{- fail "Credentials Secret missing on upgrade; restore it from backup, or supply an existing Secret with credentials.create=false" -}}
{{- end -}}
{{- if and $existing (ne (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name") .Release.Name) -}}
{{- fail "Credentials Secret belongs to another owner; use credentials.create=false for operator-managed Secrets" -}}
{{- end -}}
{{- $defaults := dict "username" ("admin" | b64enc) "email" (.Values.credentials.netboxEmail | b64enc) "admin-user" ("admin" | b64enc) "email_password" ("" | b64enc) -}}
{{- range $key := list "password" "postgres-password" "db-password" "valkey-password" "admin-password" "elastic-password" "kibana-password" "filebeat-password" "kibana-encryption-key" -}}
{{- $_ := set $defaults $key (randBytes 32 | b64dec | sha256sum | b64enc) -}}
{{- end -}}
{{- $_ := set $defaults "api_token" (randBytes 32 | b64dec | sha256sum | trunc 40 | b64enc) -}}
{{- $_ := set $defaults "secret_key" (randAlphaNum 64 | b64enc) -}}
{{- $_ := set $defaults "api_token_peppers" (dict "1" (randAlphaNum 64) | toJson | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
type: Opaque
data:
  {{- range $key, $value := $defaults }}
  {{- if $existing }}
  {{- if not (hasKey $existing.data $key) -}}{{- fail (printf "Credentials Secret is missing key %s; restore it before upgrade" $key) -}}{{- end }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

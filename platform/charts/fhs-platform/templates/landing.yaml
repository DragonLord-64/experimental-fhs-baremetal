{{- if .Values.landing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hw-landing
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-hw-landing}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-hw-landing}
      annotations:
        checksum/page: {{ include (print $.Template.BasePath "/landing-content.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 101}
      containers:
      - name: web
        image: {{ .Values.landing.image | quote }}
        command: [python, -B, /app/server.py]
        ports: [{name: http, containerPort: 8080}]
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
        readinessProbe: {httpGet: {path: /healthz, port: http}}
        volumeMounts:
        - {name: content, mountPath: /app, readOnly: true}
      volumes:
      - name: content
        configMap:
          name: {{ .Release.Name }}-hw-landing

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hw-landing
spec:
  selector: {app: {{ .Release.Name }}-hw-landing}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}

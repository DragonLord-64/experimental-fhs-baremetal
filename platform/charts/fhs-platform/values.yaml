# Candidate defaults. --namespace selects the namespace; global.urlPrefix selects all web paths.
global:
  hostname: rmdskadevdu011.mda.ca
  urlPrefix: /test
  scheme: https
  ingressClassName: nginx
  tlsSecretName: ''
  ingressAnnotations: {}
  discovery:
    # Opt in after provisioning the read-only token and migrating static jobs.
    enabled: false
    secretKey: token
    refreshInterval: 30s
    # Device multi-select custom field; tags remain an alternative.
    selector: customField
    customField: prometheus_exporters
    nodeTag: node-exporter
    fhsTag: fhs-exporter
credentials:
  # Default: generate fhs-platform-credentials once and preserve it on upgrades.
  # Set create=false only after supplying that Secret in the candidate namespace.
  # Required keys: username, email, password, api_token (40 hex), secret_key,
  # api_token_peppers (JSON map), email_password (may be empty), postgres-password,
  # db-password, valkey-password, admin-user, admin-password, elastic-password,
  # kibana-password, filebeat-password, kibana-encryption-key.
  # Logging passwords/encryption keys require at least 32 hexadecimal characters.
  create: true
  netboxEmail: admin@localhost
netbox:
  enabled: true
  fullnameOverride: fhs-netbox
  basePath: netbox/
  plugins: [netbox_inventory, netbox_prometheus_sd, netbox_topology_views]
  pluginsConfig:
    netbox_inventory:
      sync_hardware_serial_asset_tag: true
  fieldChoices:
    netbox_inventory.Asset.status+:
    - [faulty, Faulty / quarantine, red]
  # Public image; the pinned plugin is installed into per-pod writable volumes.
  image:
    registry: ghcr.io
    repository: netbox-community/netbox
    tag: v4.7.0
    digest: sha256:fa7ffa268c39fb258bed80bd256360a525f1a129ee4ee06298f10d6708578eba
    pullPolicy: IfNotPresent
  initContainers: &inventoryPluginInit
  - name: install-inventory-plugin
    image: '{{ include "netbox.image" . }}'
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -ec
    - |
      export TMPDIR=/plugin-packages/.tmp
      mkdir -p "$TMPDIR"
      if ! /opt/netbox/venv/bin/python -c 'from importlib.metadata import version; assert version("netbox-inventory") == "2.7.1"' 2>/dev/null; then
        printf '%s\n' 'netbox-inventory==2.7.1 --hash=sha256:7bc88a3b84aa77557a237039c6a5e75f58edb0b854bf782d98955695e921f717' > /plugin-packages/requirements.txt
        /usr/local/bin/uv pip install --no-cache --no-deps --require-hashes --python /opt/netbox/venv/bin/python --target /plugin-packages --requirement /plugin-packages/requirements.txt
      fi
      if ! /opt/netbox/venv/bin/python -c 'from importlib.metadata import version; assert version("netbox-plugin-prometheus-sd") == "2.2.0"' 2>/dev/null; then
        printf '%s\n' 'netbox-plugin-prometheus-sd==2.2.0 --hash=sha256:14e7b8f64a499b5cb3c5e86db459f85c4a1ce3f8b1e26589f15826194a39bb1c' > /plugin-packages/discovery.txt
        /usr/local/bin/uv pip install --no-cache --no-deps --require-hashes --python /opt/netbox/venv/bin/python --target /plugin-packages --requirement /plugin-packages/discovery.txt
      fi
      if ! /opt/netbox/venv/bin/python -c 'from importlib.metadata import version; assert version("netbox-topology-views") == "5.0.0"' 2>/dev/null; then
        printf '%s\n' 'netbox-topology-views==5.0.0 --hash=sha256:afe03396b67e8ed16ae2ad43d13bd8380f48cc0ffd1621259b6a60fa21f7170f' > /plugin-packages/topology.txt
        /usr/local/bin/uv pip install --no-cache --no-deps --require-hashes --python /opt/netbox/venv/bin/python --target /plugin-packages --requirement /plugin-packages/topology.txt
      fi
      cp -R /opt/netbox/netbox/static/. /plugin-static/
      mkdir -p /plugin-static/netbox_topology_views/img
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: '1', memory: 256Mi}
    volumeMounts:
    - name: inventory-plugin-packages
      mountPath: /plugin-packages
    - name: inventory-plugin-static
      mountPath: /plugin-static
  # Also expose the package path to kubectl exec / management commands.
  extraEnvVarsCM: fhs-netbox-plugin-environment
  extraVolumes: &inventoryPluginVolumes
  - name: inventory-plugin-packages
    emptyDir: {}
  - name: inventory-plugin-static
    emptyDir: {}
  extraVolumeMounts: &inventoryPluginMounts
  - name: inventory-plugin-packages
    mountPath: /opt/netbox/plugin-packages
    readOnly: true
  - name: inventory-plugin-static
    mountPath: /opt/netbox/netbox/static
  # The pinned launcher hardcodes /static; align it with BASE_PATH without
  # bypassing initialization or replacing its other Granian settings.
  command:
  - /usr/bin/env
  - PYTHONPATH=/opt/netbox/plugin-packages
  - /opt/netbox/docker-entrypoint.sh
  - /bin/bash
  - -ec
  - >-
    /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py collectstatic --no-input;
    exec /bin/bash <(sed 's|--static-path-route "/static"|--static-path-route "{{ include "fhs-platform.prefix" . }}/netbox/static"|' /opt/netbox/launch-netbox.sh)
  postgresql:
    enabled: false
  valkey:
    enabled: false
  externalDatabase:
    # To reuse a PostgreSQL >=15 SERVER: set umbrella postgresql.enabled=false;
    # use a qualified host such as postgresql.old-monitoring.svc.cluster.local,
    # a separate restored database (netbox_candidate_copy) and role (netbox_candidate).
    # Set existingSecretName=candidate-db after creating that namespace-local
    # Secret with key db-password; configure options.sslmode for that server.
    # Never run candidate migrations against the original live database.
    host: fhs-postgresql
    database: netbox
    username: netbox
    existingSecretName: fhs-platform-credentials
    existingSecretKey: db-password
  tasksDatabase:
    host: fhs-valkey-primary
    database: 0
    existingSecretName: fhs-platform-credentials
    existingSecretKey: valkey-password
  cachingDatabase:
    host: fhs-valkey-primary
    database: 1
    existingSecretName: fhs-platform-credentials
    existingSecretKey: valkey-password
  existingSecret: fhs-platform-credentials
  superuser:
    existingSecret: fhs-platform-credentials
  ingress:
    enabled: false
  service:
    type: ClusterIP
  persistence:
    storageClass: nfss1
    size: 1Gi
    annotations:
      helm.sh/resource-policy: keep
  # Upstream's shared ReadWriteOnce media requires all consumers on one node.
  # Match this release's media consumers; omitted namespaces means this namespace.
  affinity: &netboxMediaAffinity
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ include "common.names.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - netbox
            - worker
            - housekeeping
        topologyKey: kubernetes.io/hostname
  housekeeping:
    affinity: *netboxMediaAffinity
    initContainers: *inventoryPluginInit
    extraEnvVarsCM: fhs-netbox-plugin-environment
    extraVolumes: *inventoryPluginVolumes
    extraVolumeMounts: *inventoryPluginMounts
    command: [/usr/bin/env, PYTHONPATH=/opt/netbox/plugin-packages, /opt/netbox/venv/bin/python, /opt/netbox/netbox/manage.py, housekeeping]
  extraEnvs:
  - name: GRANIAN_EXTRA_ARGS
    value: --host=0.0.0.0
  - name: GRANIAN_WORKERS
    value: '2'
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: '2'
      memory: 2048Mi
  worker:
    affinity: *netboxMediaAffinity
    initContainers: *inventoryPluginInit
    extraEnvVarsCM: fhs-netbox-plugin-environment
    extraVolumes: *inventoryPluginVolumes
    extraVolumeMounts: *inventoryPluginMounts
    command: [/usr/bin/env, PYTHONPATH=/opt/netbox/plugin-packages, /opt/netbox/venv/bin/python, /opt/netbox/netbox/manage.py, rqworker]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 768Mi
  readinessProbe:
    path: null
  startupProbe:
    path: null
  updateStrategy:
    type: Recreate
  allowedHosts:
  - '*'
  loginRequired: true
  sessionCookieName: fhs_netbox_session
  extraConfig:
  - values:
      BASE_PATH: '{{ trimPrefix "/" (printf "%s/netbox/" (include "fhs-platform.prefix" .)) }}'
      ALLOWED_HOSTS:
      - '{{ .Values.global.hostname }}'
      - localhost
      - 127.0.0.1
      - fhs-netbox
      - 'fhs-netbox.{{ .Release.Namespace }}.svc'
      - 'fhs-netbox.{{ .Release.Namespace }}.svc.cluster.local'
      CSRF_TRUSTED_ORIGINS:
      - '{{ include "fhs-platform.origin" . }}'
      SESSION_COOKIE_NAME: '{{ include "fhs-platform.cookie" . }}_netbox'
      CSRF_COOKIE_NAME: '{{ include "fhs-platform.cookie" . }}_csrf'
      SESSION_COOKIE_PATH: '{{ include "fhs-platform.prefix" . }}/netbox/'
      CSRF_COOKIE_PATH: '{{ include "fhs-platform.prefix" . }}/netbox/'
  customReadinessProbe:
    httpGet:
      path: '{{ include "fhs-platform.prefix" . }}/netbox/login/'
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  customStartupProbe:
    httpGet:
      path: '{{ include "fhs-platform.prefix" . }}/netbox/login/'
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
postgresql:
  fullnameOverride: fhs-postgresql
  image:
    digest: sha256:660da0a4a65848258ff3a93c13a20b304c6f78dc3ce6153c7c44f4ba209e28d3
  auth:
    username: netbox
    database: netbox
    existingSecret: fhs-platform-credentials
    secretKeys:
      userPasswordKey: db-password
  primary:
    persistence:
      storageClass: bds1
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 768Mi
  enabled: true
valkey:
  fullnameOverride: fhs-valkey
  architecture: standalone
  image:
    digest: sha256:c21f8222b20f7d712399a30249e181fc9a8dec5a12118c36efa01ae4b300b277
  auth:
    existingSecret: fhs-platform-credentials
    existingSecretPasswordKey: valkey-password
  primary:
    persistence:
      storageClass: bds1
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
landing:
  enabled: true
  image: docker.io/library/python:3.13.7-alpine
  introduction: Hardware inventory, metrics and logs.
  links: []
  # Operator-configured probes only; never accepted from visitors.
  extraChecks: []
  timeoutSeconds: 4
  staleSeconds: 150
prometheus:
  extraScrapeConfigs: |
    {{- if .Values.global.discovery.enabled }}
    {{ include "fhs-platform.discovery" . }}
    {{- end }}
  server:
    persistentVolume:
      enabled: true
      storageClass: bds1
      size: 50G
      accessModes:
      - ReadWriteOnce
      annotations:
        helm.sh/resource-policy: keep
    extraSecretMounts:
    - name: netbox-discovery
      secretName: fhs-netbox-discovery
      mountPath: /etc/netbox-discovery
      readOnly: true
      optional: true
    retention: 15d
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: '2'
    service:
      enabled: true
      type: ClusterIP
      servicePort: 9090
    global:
      scrape_interval: 30s
      scrape_timeout: 20s
    retentionSize: 37GB
    strategy:
      type: Recreate
    fullnameOverride: fhs-prometheus
    image:
      repository: docker.io/prom/prometheus
      tag: v3.15.0
      digest: sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    alertingFiles: {}
  serverFiles:
    recording_rules.yml:
      groups:
      - name: data_rates
        interval: 30s
        rules:
        - record: instance:nexus_vlans_inBcastOctets:rate1m
          expr: rate(nexus_vlans_inBcastOctets[1m])
        - record: instance:nexus_vlans_inBcastPkts:rate1m
          expr: rate(nexus_vlans_inBcastPkts[1m])
        - record: instance:nexus_interfaces_broadcastPkts:rate1m
          expr: rate(nexus_interfaces_broadcastPkts[1m])
    prometheus.yml:
      scrape_configs:
      - job_name: switch-telegraf
        static_configs:
        - targets:
          - fhs-telegraf:9273
      - job_name: node
        metrics_path: /metrics
        static_configs:
        - targets:
          - 192.168.8.31:9100
          labels:
            node_name: sys1353
        - targets:
          - 192.168.8.33:9100
          labels:
            node_name: sys1389
        - targets:
          - 192.168.8.35:9100
          labels:
            node_name: sys1390
        - targets:
          - 192.168.8.37:9100
          labels:
            node_name: sys1413
        - targets:
          - 192.168.8.39:9100
          labels:
            node_name: sys1412
        - targets:
          - 192.168.8.41:9100
          labels:
            node_name: sys1392
        - targets:
          - 192.168.8.43:9100
          labels:
            node_name: sys1391
        - targets:
          - 192.168.8.45:9100
          labels:
            node_name: sys1354
      - job_name: fhs-exporter
        metrics_path: /metrics
        static_configs:
        - targets:
          - 192.168.8.31:9110
          labels:
            node_name: sys1353
        - targets:
          - 192.168.8.33:9110
          labels:
            node_name: sys1389
        - targets:
          - 192.168.8.35:9110
          labels:
            node_name: sys1390
        - targets:
          - 192.168.8.37:9110
          labels:
            node_name: sys1413
        - targets:
          - 192.168.8.39:9110
          labels:
            node_name: sys1412
        - targets:
          - 192.168.8.41:9110
          labels:
            node_name: sys1392
        - targets:
          - 192.168.8.43:9110
          labels:
            node_name: sys1391
        - targets:
          - 192.168.8.45:9110
          labels:
            node_name: sys1354
      rule_files:
      - /etc/config/recording_rules.yml
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  configmapReload:
    prometheus:
      enabled: true
  rbac:
    create: false
telegraf:
  config:
    agent:
      interval: 10s
      round_interval: true
      metric_batch_size: 1000
      metric_buffer_limit: 10000
      flush_interval: 10s
    inputs:
    - cisco_telemetry_mdt:
        transport: grpc
        service_address: :57000
        aliases:
          nexus_interfaces: sys/intf
          nexus_vlans: sys/bd
          nexus_ch: sys/ch
        fielddrop:
        - clearTs
        - modTs
        - subscription
    - http_listener_v2:
        service_address: :8080
        paths:
        - /pdu
        methods:
        - POST
        - PUT
        data_source: body
        data_format: json
        name_override: pdu
        tag_keys:
        - pdu_id
        read_timeout: 10s
        write_timeout: 10s
        max_body_size: 1MB
    processors:
    - regex:
        namepass:
        - nexus_interfaces_*
        tags:
        - key: dn
          pattern: phys-\[(?P<interface>[^\]]+)\]
          replacement: ${interface}
          result_key: interface
        - key: dn
          pattern: dbgIf(?P<direction>In|Out)
          replacement: ${direction}
          result_key: direction
    outputs:
    - prometheus_client:
        listen: :9273
        metric_version: 2
        path: /metrics
  service:
    enabled: true
    type: ClusterIP
    port: 57000
    additionalPorts:
    - name: pdu-http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9273
      targetPort: 9273
      protocol: TCP
  containerPorts:
  - name: pdu-http
    containerPort: 8080
    protocol: TCP
  - name: nxos
    containerPort: 57000
    protocol: TCP
  - name: metrics
    containerPort: 9273
    protocol: TCP
  fullnameOverride: fhs-telegraf
  image:
    repo: docker.io/library/telegraf
    tag: 1.40.1@sha256:e91237482edcb054c81571923c6b7cf64f06ed6087a2f9cf0bd3bc2cd8c0ed61
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tplVersion: 2
grafana:
  enabled: true
  fullnameOverride: fhs-grafana
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.3
    sha: b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
  admin:
    existingSecret: fhs-platform-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: bds1
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  testFramework:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://fhs-prometheus.{{ .Release.Namespace }}.svc:9090
        isDefault: true
  rbac:
    namespaced: true
  grafana.ini:
    server:
      domain: '{{ .Values.global.hostname }}'
      root_url: '{{ include "fhs-platform.origin" . }}{{ include "fhs-platform.prefix" . }}/grafana/'
      serve_from_sub_path: true
    auth:
      login_cookie_name: '{{ include "fhs-platform.cookie" . }}_grafana'
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: fhs-infrastructure
        orgId: 1
        folder: FHS infrastructure
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/fhs-dashboards
  extraVolumes:
  - name: dashboard-archives
    configMap:
      name: fhs-dashboard-archives
  extraEmptyDirMounts:
  - name: fhs-dashboards
    mountPath: /var/lib/grafana/fhs-dashboards
  extraInitContainers:
  - name: unpack-dashboards
    image: docker.io/grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    command:
    - /bin/sh
    - -ec
    args:
    - "for archive in /archives/*.json.gz; do\n  name=\"$(basename \"$archive\" .gz)\"\n  gzip -dc \"$archive\"\
      \ | sed 's|/d/|{{ include \"fhs-platform.prefix\" . }}/grafana/d/|g' > \"/dashboards/$name\"\ndone\n"
    securityContext:
      runAsUser: 472
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: dashboard-archives
      mountPath: /archives
      readOnly: true
    - name: fhs-dashboards
      mountPath: /dashboards
  podAnnotations:
    checksum/fhs-dashboards: a7301487d21b661c9a50db0bc02984a4a0e0e27735e098d668e30134d1fc34a4
  env:
    FHS_GRAFANA_HEALTH_PATH: '{{ include "fhs-platform.prefix" . }}/grafana/api/health'
  readinessProbe:
    httpGet: null
    exec:
      command:
      - /bin/sh
      - -ec
      - wget -q -O /dev/null "http://127.0.0.1:3000${FHS_GRAFANA_HEALTH_PATH}"
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    httpGet: null
    exec:
      command:
      - /bin/sh
      - -ec
      - wget -q -O /dev/null "http://127.0.0.1:3000${FHS_GRAFANA_HEALTH_PATH}"
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

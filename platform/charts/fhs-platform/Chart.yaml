apiVersion: v2
name: fhs-platform
description: Isolated NetBox, monitoring and logging in one namespaced release
type: application
version: 0.1.0
dependencies:
  - name: netbox
    version: 8.3.67
    repository: oci://ghcr.io/netbox-community/netbox-chart
  - name: postgresql
    version: 18.8.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: valkey
    version: 6.2.16
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: prometheus
    version: 29.35.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: telegraf
    version: 1.8.77
    repository: https://helm.influxdata.com
  - name: grafana
    version: 13.2.7
    repository: https://grafana-community.github.io/helm-charts
  - name: elasticsearch-kibana
    alias: logging
    version: 0.5.1
    repository: file://../elasticsearch-kibana

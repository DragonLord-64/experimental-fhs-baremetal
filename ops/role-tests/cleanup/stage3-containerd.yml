---
- ansible.builtin.set_fact:
    containerd_config:
      stdout: "{{ runtime_table }}\nSystemdCgroup = false"
    final_config_task: "{{ lookup('file', repo ~ '/roles/setup_fhs_node/tasks/install-containerd.yml') | from_yaml | selectattr('name', 'equalto', 'Write final containerd configuration') | first }}"
- name: Extract actual content expression for Ansible template evaluation
  ansible.builtin.copy:
    dest: "{{ scratch.path }}/containerd-content.j2"
    content: "{{ final_config_task['ansible.builtin.copy']['content'] }}"
    mode: '0600'
- name: Write actual final containerd content into fixture
  ansible.builtin.copy:
    dest: "{{ scratch.path }}/config.toml"
    content: "{{ lookup('template', scratch.path ~ '/containerd-content.j2') }}"
    mode: "{{ final_config_task['ansible.builtin.copy']['mode'] }}"
- name: Repeat actual containerd content for unchanged inputs
  ansible.builtin.copy:
    dest: "{{ scratch.path }}/config.toml"
    content: "{{ lookup('template', scratch.path ~ '/containerd-content.j2') }}"
    mode: "{{ final_config_task['ansible.builtin.copy']['mode'] }}"
  register: repeat_config
- ansible.builtin.assert:
    that:
      - not repeat_config.changed
      - "'SystemdCgroup = true' in lookup('file', scratch.path ~ '/config.toml')"
      - "'SystemdCgroup = false' not in lookup('file', scratch.path ~ '/config.toml')"

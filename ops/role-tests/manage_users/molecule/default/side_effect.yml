---
# Review note: verify a meaningful policy change, observe deliberate container drift, then repair it.
- name: Change meaningful managed sudo policy
  ansible.builtin.import_playbook: converge.yml
  vars:
    test_phase: changed
- name: Verify changed policy
  ansible.builtin.import_playbook: verify.yml
  vars:
    test_phase: changed
- name: Introduce and observe container-only drift
  hosts: all
  gather_facts: false
  tasks:
    - name: Damage managed shell key and sudo mode
      ansible.builtin.shell: |
        usermod --shell /bin/sh moleculeuser
        truncate -s 0 /home/moleculeuser/.ssh/authorized_keys
        chmod 0600 /etc/sudoers.d/99-fhs-passwordless
      changed_when: true
    # Review note: proving drift first prevents an unchanged fixture from masquerading as recovery.
    - name: Prove deliberate drift exists before repair
      ansible.builtin.script:
        cmd: verify_state.py drift
        executable: /usr/bin/python3
      changed_when: false
      no_log: true
- name: Repair deliberate drift with actual role
  ansible.builtin.import_playbook: converge.yml
  vars:
    test_phase: changed
- name: Verify repaired state
  ansible.builtin.import_playbook: verify.yml
  vars:
    test_phase: changed

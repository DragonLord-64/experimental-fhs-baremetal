[agent]
  interval = "10s"
  flush_interval = "1s"
  omit_hostname = true
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"
  [inputs.cisco_telemetry_mdt.aliases]
    nexus_interfaces = "sys/intf"
    nexus_vlans = "sys/bd"
    nexus_ch = "sys/ch"
    nexus_lldp = "sys/lldp"
  [inputs.cisco_telemetry_mdt.dmes]
    dnpath_lldp = '{"Name":"sys/lldp","prop":[{"Key":"id","Value":"integer"},{"Key":"sysName","Value":"string"},{"Key":"portIdV","Value":"string"},{"Key":"chassisIdV","Value":"string"},{"Key":"portDesc","Value":"string"}]}'
[[processors.regex]]
  namepass = ["nexus_interfaces*", "nexus_lldp*"]
  [[processors.regex.tags]]
    key = "dn"
    pattern = '^.*(?:phys|if)-\[(?P<interface>[^\]]+)\].*$'
    replacement = "${interface}"
    result_key = "interface"
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  string_as_label = true

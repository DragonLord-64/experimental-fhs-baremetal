# Standalone Prometheus chart29.35.0; namespace mid-cbf-monitoring.
# bds1CephRBD, requested50G, retainedblocks37GB (~39.7decimalGB).
# Custom exporter9110 is provisional. No endpoint authentication is configured.
server:
  persistentVolume:
    enabled: true
    storageClass: bds1
    size: 50G
    accessModes:
    - ReadWriteOnce
  retention: 15d
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: '2'
  service:
    enabled: true
    type: LoadBalancer
    servicePort: 9090
  global:
    scrape_interval: 30s
    scrape_timeout: 20s
  retentionSize: 37GB
  strategy:
    type: Recreate
  fullnameOverride: monitoring-prometheus
  image:
    repository: docker.io/prom/prometheus
    tag: v3.15.0
    digest: sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e

  alertingFiles: {}

serverFiles:
  recording_rules.yml:
    groups:
    - name: data_rates
      interval: 30s
      rules:
      - record: instance:nexus_vlans_inBcastOctets:rate1m
        expr: rate(nexus_vlans_inBcastOctets[1m])
      - record: instance:nexus_vlans_inBcastPkts:rate1m
        expr: rate(nexus_vlans_inBcastPkts[1m])
      - record: instance:nexus_interfaces_broadcastPkts:rate1m
        expr: rate(nexus_interfaces_broadcastPkts[1m])
  prometheus.yml:
    scrape_configs:
    - job_name: switch-telegraf
      static_configs:
      - targets:
        - switch-telegraf:9273
    - job_name: node
      metrics_path: /metrics
      static_configs:
      - targets: ["192.168.8.31:9100"]
        labels:
          node_name: "sys1353"
      - targets: ["192.168.8.33:9100"]
        labels:
          node_name: "sys1389"
      - targets: ["192.168.8.35:9100"]
        labels:
          node_name: "sys1390"
      - targets: ["192.168.8.37:9100"]
        labels:
          node_name: "sys1413"
      - targets: ["192.168.8.39:9100"]
        labels:
          node_name: "sys1412"
      - targets: ["192.168.8.41:9100"]
        labels:
          node_name: "sys1392"
      - targets: ["192.168.8.43:9100"]
        labels:
          node_name: "sys1391"
      - targets: ["192.168.8.45:9100"]
        labels:
          node_name: "sys1354"
    - job_name: fhs-exporter
      metrics_path: /metrics
      static_configs:
      - targets: ["192.168.8.31:9110"]
        labels:
          node_name: "sys1353"
      - targets: ["192.168.8.33:9110"]
        labels:
          node_name: "sys1389"
      - targets: ["192.168.8.35:9110"]
        labels:
          node_name: "sys1390"
      - targets: ["192.168.8.37:9110"]
        labels:
          node_name: "sys1413"
      - targets: ["192.168.8.39:9110"]
        labels:
          node_name: "sys1412"
      - targets: ["192.168.8.41:9110"]
        labels:
          node_name: "sys1392"
      - targets: ["192.168.8.43:9110"]
        labels:
          node_name: "sys1391"
      - targets: ["192.168.8.45:9110"]
        labels:
          node_name: "sys1354"
    rule_files:
    - /etc/config/recording_rules.yml
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
configmapReload:
  prometheus:
    enabled: false

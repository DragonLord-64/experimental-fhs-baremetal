---
# Primary FHS site playbook. Hosts are targeted by group (defined in
# `inventory/dev_env/hosts.yml`); per-group plays apply the relevant role.
#
# Each role is tagged with its role name so a provisioning run can select an
# exact set of roles, for example:
#   ansible-playbook playbooks/provision.yml --tags manage_users,setup_fhs_network

- name: Foundation (network)
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tags: [foundation]
  tasks:
    - name: Apply network_setup role
      ansible.builtin.include_role:
        name: setup_fhs_network
        apply:
          tags: [setup_fhs_network]
      tags: [setup_fhs_network]

- name: Distribution access
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tags: [distribution]
  tasks:
    - name: Install platform CA trust
      ansible.builtin.include_role:
        name: setup_platform_ca
        apply:
          tags: [setup_platform_ca]
      tags: [setup_platform_ca]
    - name: Apply apt_repo_access
      ansible.builtin.include_role:
        name: setup_apt_source
        apply:
          tags: [setup_apt_source]
      tags: [setup_apt_source]
    - name: Update Ubuntu Python tooling and certificate trust
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3.12
          - python3.12-venv
          - python3-pip
          - python3-pip-whl
        state: latest
        update_cache: true
      tags: [python_ca_updates]
    - name: Apply pip_index
      ansible.builtin.include_role:
        name: setup_pip_source
        apply:
          tags: [setup_pip_source]
      tags: [setup_pip_source]
    - name: Apply Git proxy
      ansible.builtin.include_role:
        name: setup_git_proxy
        apply:
          tags: [setup_git_proxy]
      tags: [setup_git_proxy]

- name: Environment setup
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tags: [environment]
  tasks:
    - name: Configure users and BittWare environments
      ansible.builtin.include_role:
        name: manage_users
        apply:
          tags: [manage_users]
      tags: [manage_users]

- name: DPDK, Arkville, and DOCA install
  hosts: device_roles_fpga-host-server
  gather_facts: false
  tags: [dpdk_arkville]
  tasks:
    - name: Install dpdk, arkville, and doca
      ansible.builtin.include_role:
        name: manage_dpdk_ark_doca
        apply:
          tags: [manage_dpdk_ark_doca]
      tags: [manage_dpdk_ark_doca]

- name: FHS nodes
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: true
  tasks:
    - name: Set up Kubernetes node
      ansible.builtin.include_role:
        name: setup_k8s_node
        apply:
          tags: [setup_k8s_node]
      tags: [setup_k8s_node]
    - name: Install FHS BIST
      ansible.builtin.include_role:
        name: manage_fhs_bist
        apply:
          tags: [manage_fhs_bist]
      tags: [manage_fhs_bist]

- name: Ubuntu 24 Linux server policy
  hosts: ubuntu24_cis_production
  become: true
  gather_facts: true
  tags: [ubuntu24_cis]
  tasks:
    - name: Verify effective CIS policy before apply
      ansible.builtin.import_tasks: tasks/cis-policy-preflight.yml
    - name: Apply Ubuntu 24 CIS hardening
      ansible.builtin.include_role:
        name: ubuntu24_cis
        apply:
          tags: [ubuntu24_cis]
      tags: [ubuntu24_cis]

- name: FHS services
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: true
  tasks:
    - name: Install FHS exporter
      ansible.builtin.include_role:
        name: manage_fhs_exporter
        apply:
          tags: [manage_fhs_exporter]
      tags: [manage_fhs_exporter]
    - name: Install Prometheus
      ansible.builtin.include_role:
        name: manage_prometheus
        apply:
          tags: [manage_prometheus]
      tags: [manage_prometheus]
    - name: Install Filebeat
      ansible.builtin.include_role:
        name: filebeat
        apply:
          tags: [filebeat]
      tags: [filebeat]

- name: FPGA hosts
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tasks:
    - name: Setup FPGA cards and server
      ansible.builtin.include_role:
        name: setup_fpga_host
        apply:
          tags: [setup_fpga_host]
      tags: [setup_fpga_host]

- name: File transfer service
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tags: [rsync]
  tasks:
    - name: Ensure the rsync package
      ansible.builtin.apt:
        name: rsync
        state: present
    - name: Ensure rsync service is active and starts at boot
      ansible.builtin.systemd_service:
        name: rsync
        state: started
        enabled: true

- name: HW Management
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  tags: [hw_management]
  tasks:
    - name: Fetch and verify lldpd package
      ansible.builtin.apt:
        name: lldpd
        state: present
    - name: Establish systemd persistence for the lldpd service
      ansible.builtin.systemd:
        name: lldpd
        state: started
        enabled: true

- name: Check Python certificate trust after provisioning
  ansible.builtin.import_playbook: audit_python_ca.yml

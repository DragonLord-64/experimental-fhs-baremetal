# Shared import/export settings. Override per run with -e key=value.
platform_endpoints_file: "{{ lookup('env', 'FHS_PLATFORM_ENDPOINTS_FILE') | default('/provision/files.d/platform-endpoints.yml', true) }}"
netbox_credentials_file: "{{ lookup('env', 'FHS_PLATFORM_SECRETS_FILE') | default('/provision/files.d/credentials/platform-secrets.yml', true) }}"
netbox_validate_certs_default: true
hardware_command_path: '{{ ''/opt/netbox-demo/bin:/usr/sbin:/usr/bin:/sbin:/bin'' if hardware_simulation
  | default(false) | bool else ''/usr/sbin:/usr/bin:/sbin:/bin'' }}'
bootstrap_bittware_enabled: true
bootstrap_bittware_venv: '{{ bittware_sdk_venv | default(gitlab_runner_venv_path | default("/opt/venvs/fhs")) }}'
bootstrap_bittware_sdk_root: '{{ fpga_bittware_sdk_root | default(bwsdk_root_path | default("/usr/share/bittware-sdk")) }}'
bootstrap_bittware_user: '{{ fpga_bittware_user | default(gitlab_runner_user | default(ansible_user | default(ansible_facts.user_id))) }}'
bootstrap_bittware_card_list_argv:
- bw_card_list
- -v
- -i
- USB
bootstrap_bittware_serial_pattern: ^IA-860M\s+(\S+)\s*$
bootstrap_bittware_part_pattern: ^\s*Part Number\s*:\s*(.+)$
bootstrap_bittware_version_pattern: ^\s*Version\s*:\s*(.+)$
bootstrap_bittware_bmc_firmware_pattern: ^\s*BMC Version\s*:\s*(.+)$
bootstrap_bittware_index_pattern: ^\s*Index\s*:\s*(\d+)\b
resource_field_definitions:
  cpu_arch: text
  ram: integer
  cpus: integer
  disk_size: integer
unavailable_values:
- ''
- unknown
- not specified
- not available
- none
- to be filled by o.e.m.
bootstrap_bittware_pci_list_argv:
- lspci
- -D
- -nn
bootstrap_bittware_pci_map: {}
bootstrap_fpga_interface_type: 400gbase-x-qsfpdd
bootstrap_bittware_debug: false
bootstrap_nic_enabled: true
bootstrap_nic_manufacturer: Mellanox
bootstrap_nic_drivers:
- mlx5_core
bootstrap_nic_ethtool_argv:
- ethtool
bootstrap_nic_vpd_argv:
- lspci
- -vv
- -s
bootstrap_nic_collect_link: true
bootstrap_nic_part_pattern: \[PN\]\s+Part number:\s*(\S+)
bootstrap_nic_serial_pattern: \[SN\]\s+Serial number:\s*(\S+)
netbox_api_retries: 3
netbox_api_retry_delay: 5
netbox_api_loop_pause: 1
nexus_site: '{{ bootstrap_site | default(''Bootstrap Lab'') }}'
nexus_role: '{{ bootstrap_role | default('''') }}'
nexus_commands:
- show inventory all | json
- show version | json
- show interface transceiver | json
nexus_epld_command: show version module 1 epld
bifrost_output: '{{ playbook_dir }}/output/baremetal.yml'
bifrost_device_type: '{{ bootstrap_device_type | default(''TeraBox1501b'') }}'
bifrost_provisioning_tag: provisioning-interface
bifrost_root_device:
  size: '> 900'
bifrost_capabilities: boot_mode:uefi
allowed_extra:
- uuid
- properties
- instance_info
- ipv4_address
- provisioning_ipv4_address
- addressing_mode
- node_network_data
- ipa_kernel_url
- ipa_ramdisk_url
- boot_interface
- deploy_interface
- management_interface
- power_interface
- inspect_interface
- automated_clean
- host_groups
redfish_credentials_file: /provision/files.d/credentials/redfish.yml
bootstrap_topology_enabled: true
bootstrap_lldp_argv:
- lldpcli
- -f
- json
- show
- neighbors
bootstrap_bittware_qsfp_argv:
- bw_qsfp_info
nexus_lldp_command: show lldp neighbors detail | json
netbox_site: '{{ server_info.site | default(bootstrap_site | default(''MDA'')) }}'
netbox_role: '{{ server_info.role | default(bootstrap_role | default('''')) }}'

# Explicit verified endpoint pairs only; no automatic stripping of serial suffixes.
# Each pair requires vendor, part, host_serial, switch_serial, evidence.
bootstrap_dac_endpoint_pairs: []

# NetBox requires a face for newly positioned devices; retain existing face.
netbox_rack_face_default: front

server_info_path: /etc/server-info.yaml

# Opt-in controller evidence only; directory must already exist with mode 0700.
bootstrap_discovery_capture_dir: ""

# Read-only NX-OS output; the observed interface and prefix are authoritative.
nexus_management_command: show interface mgmt0

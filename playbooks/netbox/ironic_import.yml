---
# Standalone pre-OS import; no target SSH or installed operating system required.
- name: Import selected Ironic inspection records into NetBox
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ironic_import_script: "{{ playbook_dir }}/ironic_minimal.py"
  tasks:
    - name: Require an explicit exact Ironic selector or all records
      ansible.builtin.assert:
        that:
          - ((hwmanage_limit | default('') | length > 0) | int) + ((hwmanage_all | default(false) | bool) | int) + ((hwmanage_selected_uuids is defined) | int) == 1
          - hwmanage_selected_uuids is not defined or (hwmanage_selected_uuids is sequence and hwmanage_selected_uuids is not string and hwmanage_selected_uuids | length > 0)
        fail_msg: Supply hwmanage_limit (exact UUID or name) or hwmanage_all=true.
    - name: Install the remote FRU client on the controller
      ansible.builtin.package:
        name: ipmitool
        state: present
      become: true
      when: not ansible_check_mode
    - name: Import saved inspection and verified remote FRU identity
      ansible.builtin.command:
        argv: "{{ [ansible_playbook_python, ironic_import_script] + (['--selected-uuids', hwmanage_selected_uuids | to_json] if hwmanage_selected_uuids is defined else (['--limit', hwmanage_limit] if hwmanage_limit | default('') | length > 0 else ['--all'])) + (['--plan'] if ansible_check_mode else []) }}"
      environment:
        HWMANAGE_IMPORT_DEFAULTS: "{{ hwmanage_import_defaults | default(lookup('ansible.builtin.env', 'HWMANAGE_IMPORT_DEFAULTS') | default(playbook_dir ~ '/../../bifrost-infra/hwmanage/import.yml', true)) }}"
        HWMANAGE_BMC_SECRETS: "{{ hwmanage_bmc_secrets | default(lookup('ansible.builtin.env', 'HWMANAGE_BMC_SECRETS') | default('/provision/files.d/credentials/redfish.yml', true)) }}"
      check_mode: false
      changed_when: not ansible_check_mode

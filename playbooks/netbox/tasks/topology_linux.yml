- name: Read existing LLDP neighbors without changing daemon configuration
  ansible.builtin.command:
    argv: '{{ bootstrap_lldp_argv | default(["lldpcli", "-f", "json", "show", "neighbors"]) }}'
  register: topology_lldp
  check_mode: false
  changed_when: false
  failed_when: false
  become: true
  tags: [always]
- name: Read physical NIC cable EEPROM
  ansible.builtin.command:
    argv: '{{ bootstrap_nic_ethtool_argv + ["-m", item.interface] }}'
  loop: '{{ nic_ports | default([]) }}'
  register: topology_nic_eeprom
  check_mode: false
  changed_when: false
  failed_when: false
  become: true
  tags: [always]
- name: Keep Linux topology observations for controller reconciliation
  ansible.builtin.set_fact:
    fhs_topology: '{{ facts.hostname | fhs_topology_linux(topology_lldp, topology_nic_eeprom.results | default([]), topology_fpga_eeprom.results | default([]), {"aliases": [inventory_hostname, ansible_host | default(inventory_hostname)], "macs": facts | dict2items | selectattr("value", "mapping") | selectattr("value.macaddress", "defined") | map(attribute="value.macaddress") | list}) }}'
  tags: [always]
- name: Retain optional protected Linux probe evidence
  ansible.builtin.import_tasks: capture.yml
  vars:
    discovery_raw_captures:
      sdk: '{{ _bittware_raw | default({}) }}'
      lldp: '{{ topology_lldp }}'
      nic_eeprom: '{{ topology_nic_eeprom.results | default([]) }}'

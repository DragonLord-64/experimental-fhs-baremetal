- name: Add discovered placement and metadata fields
  tags:
  - apply
  when:
  - not ansible_check_mode
  - fhs_stage == "servers"
  - '"compare" not in ansible_run_tags and "facts" not in ansible_run_tags'
  throttle: 1
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure rack location within the site
    netbox.netbox.netbox_location:
      data:
        name: '{{ server_info.location }}'
        site: '{{ netbox_site }}'
      query_params:
      - name
      - site
    register: ensured_location
    when: server_info.location is defined
    until: ensured_location is succeeded or not (ensured_location | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure rack within the site and location
    netbox.netbox.netbox_rack:
      data:
        name: '{{ server_info.rack }}'
        site: '{{ netbox_site }}'
        location: '{{ ensured_location.location.id if server_info.location is defined else omit }}'
      query_params:
      - name
      - site
    register: ensured_rack
    when: server_info.rack is defined
    until: ensured_rack is succeeded or not (ensured_rack | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure OS version field
    netbox.netbox.netbox_custom_field:
      data:
        name: os_version
        label: OS version
        type: text
        object_types:
        - dcim.device
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure discovered hardware fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ item }}'
        type: text
        object_types:
        - dcim.device
    loop: '{{ hardware_fields.keys() | list | difference(["hardware_identity_sources", "fru_inventory"]) }}'
    loop_control:
      pause: '{{ netbox_api_loop_pause }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure identity provenance and FRU observation fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ item }}'
        type: json
        object_types:
        - dcim.device
    loop: '{{ ["hardware_identity_sources", "fru_inventory"] | intersect(hardware_fields.keys() | list) }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Create only missing resource custom fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ resource_definition.key }}'
        type: '{{ resource_definition.value }}'
        object_types:
        - dcim.device
    loop: '{{ resource_field_definitions | dict2items }}'
    loop_control:
      loop_var: resource_definition
      pause: '{{ netbox_api_loop_pause }}'
    when:
    - resource_definition.key not in resource_field_types
    - resource_definition.key in resource_fields
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure explicit simulated hardware tag
    netbox.netbox.netbox_tag:
      data:
        name: simulated-hardware
        slug: simulated-hardware
        color: ff9800
    when: hardware_simulation | default(false) | bool
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
- name: Apply discovered server inventory to NetBox
  tags:
  - apply
  when:
  - not ansible_check_mode
  - '"compare" not in ansible_run_tags and "facts" not in ansible_run_tags'
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure server device
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        site: '{{ server_info.site | default(bootstrap_site | default(omit)) }}'
        rack: '{{ ensured_rack.rack.id if server_info.rack is defined else omit }}'
        location: '{{ ensured_location.location.id if server_info.location is defined else omit }}'
        status: active
        custom_fields: '{{ {''os_version'': facts.distribution ~ '' '' ~ facts.distribution_version} | combine(hardware_fields)
          | combine(netbox_resource_fields) }}'
        tags: '{{ ((existing_device.json.results | first | default({})).tags | default([]) | map(attribute=''name'') | list
          + [''simulated-hardware'']) | unique if hardware_simulation | default(false) | bool else omit }}'
        description: '{{ ''Ubuntu test container: hardware fields are SIMULATED fixtures.'' if hardware_simulation | default(false)
          | bool else omit }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    when:
    - fhs_stage == "servers"
  - name: Rename temporary provisioning interface in place
    fhs_provisioning_interface:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      device_id: '{{ desired_device_id }}'
      interfaces: '{{ discovered_interfaces }}'
    when: fhs_stage == "interfaces"
  - name: Ensure discovered interfaces
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ fhs_netbox_name | default(facts.hostname) }}'
        name: '{{ item.name }}'
        type: '{{ ''virtual'' if item.name == ''lo'' else ''other'' }}'
        mtu: '{{ item.mtu }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
      pause: '{{ netbox_api_loop_pause }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    when:
    - fhs_stage == "interfaces"
  - name: Ensure MAC objects (NetBox 4.2+)
    netbox.netbox.netbox_mac_address:
      data:
        mac_address: '{{ item.mac }}'
        assigned_object:
          device: '{{ fhs_netbox_name | default(facts.hostname) }}'
          name: '{{ item.name }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
      pause: '{{ netbox_api_loop_pause }}'
    when:
    - item.mac | lower not in ['', '00:00:00:00:00:00', '00:00:00:00', 'ee:ee:ee:ee:ee:ee']
    - fhs_stage == "interfaces"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Set interface primary MACs
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ fhs_netbox_name | default(facts.hostname) }}'
        name: '{{ item.name }}'
        primary_mac_address: '{{ item.mac }}'
    loop: '{{ discovered_interfaces }}'
    loop_control:
      label: '{{ item.name }}'
      pause: '{{ netbox_api_loop_pause }}'
    when:
    - item.mac | lower not in ['', '00:00:00:00:00:00', '00:00:00:00', 'ee:ee:ee:ee:ee:ee']
    - fhs_stage == "interfaces"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure discovered IPv4 and IPv6 addresses
    netbox.netbox.netbox_ip_address:
      query_params:
      - address
      data:
        address: '{{ item.1.address }}/{{ item.1.prefix }}'
        assigned_object:
          device: '{{ fhs_netbox_name | default(facts.hostname) }}'
          name: '{{ item.0.name }}'
        status: active
    loop: '{{ discovered_interfaces | subelements(''addresses'') }}'
    loop_control:
      label: '{{ item.0.name }}: {{ item.1.address }}'
      pause: '{{ netbox_api_loop_pause }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    when:
    - fhs_stage == "ips"
  - name: Assign discovered management primary IPv4 after address creation
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        primary_ip4:
          address: '{{ selected_primary_ipv4.address }}/{{ selected_primary_ipv4.prefix }}'
    when:
    - selected_primary_ipv4.address is defined
    - fhs_stage == "ips"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure motherboard BMC interface
    netbox.netbox.netbox_device_interface:
      data:
        device: '{{ fhs_netbox_name | default(facts.hostname) }}'
        name: bmc
        type: other
        mgmt_only: true
        description: '{{ ''SIMULATED motherboard BMC management'' if hardware_simulation | default(false) | bool else ''Motherboard
          BMC management'' }}'
    when:
    - bmc_address is defined
    - fhs_stage == "interfaces"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure motherboard BMC management address
    netbox.netbox.netbox_ip_address:
      data:
        address: '{{ bmc_address }}/32'
        assigned_object:
          device: '{{ fhs_netbox_name | default(facts.hostname) }}'
          name: bmc
        status: active
    when:
    - bmc_address is defined
    - fhs_stage == "ips"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Assign server out-of-band management IP
    netbox.netbox.netbox_device:
      data:
        name: '{{ facts.hostname }}'
        oob_ip:
          address: '{{ bmc_address }}/32'
    when:
    - bmc_address is defined
    - fhs_stage == "ips"
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  throttle: 1

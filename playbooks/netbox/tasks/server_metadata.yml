- name: Gather measured CPU architecture RAM and logical CPU count
  tags:
  - always
  - facts
  become: false
  block:
  - name: Record available architecture
    ansible.builtin.set_fact:
      resource_fields: '{{ resource_fields | combine({''cpu_arch'': facts.architecture}) }}'
    when: facts.architecture | default('') | lower not in unavailable_values
  - name: Record available RAM in MiB
    ansible.builtin.set_fact:
      resource_fields: '{{ resource_fields | combine({''ram'': facts.memtotal_mb | int}) }}'
    when: facts.memtotal_mb | default(0) | int > 0
  - name: Read logical CPU count only if the fact is unavailable
    ansible.builtin.command:
      argv:
      - nproc
    register: cpu_count_probe
    changed_when: false
    failed_when: false
    check_mode: false
    when: facts.processor_vcpus | default(0) | int <= 0
  - name: Record available logical CPU count
    ansible.builtin.set_fact:
      resource_fields: '{{ resource_fields | combine({''cpus'': logical_cpus | int}) }}'
    vars:
      logical_cpus: '{{ facts.processor_vcpus | default(0) if facts.processor_vcpus | default(0) | int > 0 else cpu_count_probe.stdout
        | default(0) }}'
    when: logical_cpus | int > 0
  rescue:
  - name: Report incomplete optional discovery
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg | default("Optional discovery unavailable; previous inventory retained") }}'
- name: Discover server BIOS
  tags:
  - bios
  - compare
  - apply
  become: '{{ not (hardware_simulation | default(false) | bool) }}'
  environment:
    PATH: '{{ hardware_command_path }}'
    LC_ALL: C
    LANG: C
  block:
  - name: Read BIOS information
    ansible.builtin.command:
      argv:
      - dmidecode
      - --type
      - bios
    register: bios_probe
    changed_when: false
    failed_when: false
    check_mode: false
  - name: Report unavailable BIOS information
    ansible.builtin.debug:
      msg: 'BIOS unavailable; existing NetBox values will be preserved: {{ bios_probe.stderr | default(bios_probe.msg | default(''No
        diagnostic returned''), true) }}'
    when: bios_probe.rc != 0 or ((bios_probe.stdout | default('')) | regex_findall('(?m)^\\s*Version:\\s*(.+)$') | first |
      default('') | trim | lower in unavailable_values)
  - name: Record available BIOS version
    ansible.builtin.set_fact:
      hardware_fields: '{{ hardware_fields | combine({''bios_version'': bios_version}) }}'
    vars:
      bios_version: '{{ (bios_probe.stdout | default('''')) | regex_findall(''(?m)^\s*Version:\s*(.+)$'') | first | default('''')
        | trim }}'
    when: bios_probe.rc == 0 and bios_version | lower not in unavailable_values
  rescue:
  - name: Report incomplete optional discovery
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg | default("Optional discovery unavailable; previous inventory retained") }}'
- name: Read BMC telemetry
  ansible.builtin.import_tasks: bmc_metadata.yml
- name: Gather individual eligible disk capacities without summing disks
  tags:
  - resources
  - compare
  - apply
  become: false
  block:
  - name: Record measured nonremovable whole-disk capacities from Linux facts
    ansible.builtin.set_fact:
      disk_candidates: '{{ disk_candidates + [{''name'': ''/dev/'' ~ disk_fact.key, ''bytes'': disk_bytes | int}] }}'
    vars:
      disk_bytes: '{{ (disk_fact.value.sectors | default(0) | int) * (disk_fact.value.sectorsize | default(512) | int) }}'
    loop: '{{ facts.devices | default({}) | dict2items | sort(attribute=''key'') }}'
    loop_control:
      loop_var: disk_fact
      label: '{{ disk_fact.key }}'
    when: not (hardware_simulation | default(false) | bool) and facts.virtualization_type | default('') not in ['docker',
      'lxc', 'container'] and disk_fact.key is match('^(sd[a-z]+|vd[a-z]+|xvd[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+)$') and
      disk_fact.value.removable | default('0') | string != '1' and (disk_bytes | int // 1073741824) > 900
  - name: Record simulated disk capacities only from the marked test fixture
    ansible.builtin.set_fact:
      disk_candidates: '{{ disk_candidates + [{''name'': disk_fixture.DevicePath, ''bytes'': disk_fixture.PhysicalSize | int}]
        }}'
    loop: '{{ (nvme_probe.stdout | from_json).Devices if nvme_probe is defined and nvme_probe.rc == 0 else [] }}'
    loop_control:
      loop_var: disk_fixture
      label: '{{ disk_fixture.DevicePath }}'
    when: hardware_simulation | default(false) | bool and (disk_fixture.PhysicalSize | default(0) | int // 1073741824) > 900
  - name: Record actual common eligible capacity in whole GiB
    ansible.builtin.set_fact:
      resource_fields: '{{ resource_fields | combine({''disk_size'': (disk_candidates | first).bytes | int // 1073741824})
        }}'
    when: disk_candidates | length > 0 and (disk_candidates | map(attribute='bytes') | unique | list | length == 1)
  - name: Report disk capacity selection without blocking inventory
    ansible.builtin.debug:
      msg:
        eligible_disks: '{{ disk_candidates }}'
        disk_size_gib: '{{ resource_fields.disk_size | default(''unavailable or differing capacities; existing value preserved'')
          }}'
        policy: Individual nonremovable whole disks above 900 GiB; equal capacities are interchangeable for this informational
          field. No install target is chosen or disk written.
  rescue:
  - name: Report incomplete optional discovery
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg | default("Optional discovery unavailable; previous inventory retained") }}'

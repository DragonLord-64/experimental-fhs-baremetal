- name: Read provisioning metadata from the server
  tags:
  - always
  - facts
  become: false
  block:
  - name: Check for server metadata
    ansible.builtin.stat:
      path: '{{ server_info_path }}'
    register: server_info_file
  - name: Initialize optional server metadata
    ansible.builtin.set_fact:
      server_info: {}
  - name: Read server metadata without modifying it
    ansible.builtin.slurp:
      src: '{{ server_info_path }}'
    register: server_info_contents
    when: server_info_file.stat.exists
  - name: Parse server metadata
    ansible.builtin.set_fact:
      server_info: '{{ server_info_contents.content | b64decode | from_yaml }}'
    when: server_info_file.stat.exists
  - name: Validate and normalize optional placement and power metadata
    ansible.builtin.set_fact:
      server_info: '{{ server_info | fhs_server_metadata }}'
  rescue:
  - name: Ignore invalid optional server metadata after reporting it
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg }}'
  - name: Continue with FRU identity
    ansible.builtin.set_fact:
      server_info: {}

- name: Write pluggables as they are observed
  when: not ansible_check_mode and "compare" not in ansible_run_tags and "facts" not in ansible_run_tags
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Write serial-bearing observed QSFP inventory
    throttle: 1
    fhs_inventory_sync:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      device: '{{ fhs_netbox_name | default(facts.hostname) }}'
      mode: components
      manufacturer: '{{ bootstrap_component_manufacturer | default("Unknown") }}'
      items: '{{ fhs_topology | fhs_pluggable_items }}'
      complete: false
      scope: '{{ bootstrap_component_scope | default([]) | intersect(["DDR5", "NVMe"]) }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'

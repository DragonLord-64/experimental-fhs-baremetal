- name: Discover optional BittWare SDK FPGA cards
  tags:
  - always
  - fpga
  - fpga_qsfp
  - compare
  - apply
  become: false
  when: bootstrap_bittware_enabled | default(false) | bool
  block:
  - name: Read installed SDK and USB cards as the configured BittWare user
    fhs_bittware_probe:
      venv: '{{ bootstrap_bittware_venv }}'
      sdk_root: '{{ bootstrap_bittware_sdk_root }}'
      user: '{{ bootstrap_bittware_user }}'
      card_argv: '{{ bootstrap_bittware_card_list_argv }}'
      qsfp_argv: '{{ bootstrap_bittware_qsfp_argv }}'
      command_path: '{{ hardware_command_path }}'
    become: true
    become_user: '{{ bootstrap_bittware_user }}'
    register: _bittware_raw
    check_mode: false
    no_log: true
  - name: Report SDK environment and USB probe outcomes
    ansible.builtin.debug:
      msg:
        probes: '{{ _bittware_raw.diagnostics }}'
        omission: '{{ _bittware_raw.omission }}'
  - name: Retain QSFP read results for port and topology parsing
    ansible.builtin.set_fact:
      topology_fpga_eeprom:
        results: '{{ _bittware_raw.qsfp }}'
  - name: Initialize optional card discovery
    ansible.builtin.set_fact:
      discovered_bittware: {cards: [], complete: false, warnings: []}
  - name: Normalize actual card output and explicit PCI mappings
    ansible.builtin.set_fact:
      discovered_bittware: '{{ _bittware_raw.stdout | fhs_fpga_cards(bootstrap_bittware_index_pattern, bootstrap_bittware_serial_pattern, bootstrap_bittware_part_pattern,
        bootstrap_bittware_version_pattern, bootstrap_bittware_bmc_firmware_pattern, bootstrap_bittware_pci_map) }}'
    when: _bittware_raw.rc == 0
  - name: Require usable card output
    ansible.builtin.assert:
      that:
      - discovered_bittware.cards | length > 0 or (bootstrap_fpga_complete | default(false) | bool and bootstrap_fpga_empty_pattern | default("") | length > 0 and _bittware_raw.stdout is search(bootstrap_fpga_empty_pattern))
      fail_msg: No complete FPGA cards parsed; check SDK output and patterns. An intentional complete empty scan needs an explicit bootstrap_fpga_empty_pattern matching the SDK empty report.
    when: _bittware_raw.rc == 0
  - name: Report SDK identity caveats without exposing identifiers
    ansible.builtin.debug:
      msg: '{{ discovered_bittware.warnings }}'
    when: discovered_bittware.warnings | default([]) | length > 0
- name: Normalize FPGA cards for module discovery
  tags:
  - always
  - fpga
  - compare
  - apply
  become: false
  block:
  - name: Build FPGA module records from observed physical port reports
    ansible.builtin.set_fact:
      desired_fpga_cards: '{{ (bootstrap_fpga_cards | default([]) + discovered_bittware.cards | default([])) | fhs_observed_fpga_ports(topology_fpga_eeprom.results | default([]), bootstrap_fpga_interface_type) | fhs_fpga_modules(bootstrap_fpga_interface_type)
        }}'

- name: Mark explicitly selected successful FPGA discovery scope
  tags: [fpga, compare, apply]
  ansible.builtin.set_fact:
    fpga_scan_complete: '{{ bootstrap_bittware_enabled | default(false) | bool and _bittware_raw.rc | default(1) == 0 and discovered_bittware.complete | default(false) | bool and (discovered_bittware.cards | length > 0 or (bootstrap_fpga_empty_pattern | default("") | length > 0 and _bittware_raw.stdout | default("") is search(bootstrap_fpga_empty_pattern))) }}'

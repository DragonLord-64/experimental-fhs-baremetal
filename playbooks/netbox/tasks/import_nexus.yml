- name: Read switch chassis and hostname
  cisco.nxos.nxos_command:
    commands: '{{ nexus_commands[:2] }}'
  register: discovered
  check_mode: false
  changed_when: false
  tags:
  - always
- name: Normalize discovered inventory before any writes
  ansible.builtin.set_fact:
    switch: '{{ (discovered.stdout + ["{}"]) | nexus_inventory }}'
  tags:
  - always
- name: Reconcile switch physical chassis asset
  throttle: 1
  fhs_inventory_sync:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    device: '{{ switch.name }}'
    mode: device
    serial: '{{ switch.serial }}'
    manufacturer: Cisco
    model: '{{ switch.model }}'
    site: '{{ nexus_site }}'
    role: '{{ nexus_role }}'
    category: nexus-switch
  register: netbox_write_result
  until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
  retries: '{{ netbox_api_retries }}'
  delay: '{{ netbox_api_retry_delay }}'
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tags:
  - servers
  - apply
  when: not ansible_check_mode and "facts" not in ansible_run_tags and "compare" not in ansible_run_tags
- name: Find existing switch parent
  tags:
  - always
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  fhs_inventory_sync:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    device: '{{ switch.name }}'
    mode: resolve
    serial: '{{ switch.serial }}'
    manufacturer: Cisco
    model: '{{ switch.model }}'
    site: '{{ nexus_site }}'
    role: '{{ nexus_role }}'
    category: nexus-switch
  register: nexus_parent
  check_mode: false
- name: Read observed switch transceivers
  tags:
  - modules
  - interfaces
  - cables
  - apply
  - compare
  when: nexus_parent.device is not none
  cisco.nxos.nxos_command:
    commands: '{{ nexus_commands[2:] }}'
  register: switch_optics
  check_mode: false
  changed_when: false
  failed_when: false
- name: Normalize available transceiver observations
  tags:
  - modules
  - interfaces
  - cables
  - apply
  - compare
  when: nexus_parent.device is not none
  ansible.builtin.set_fact:
    switch_optics_json: '{{ switch_optics.stdout[0] if switch_optics.stdout | default([]) | length > 0 and switch_optics.stdout[0]
      is match("^\s*\{") else "{}" }}'
- name: Attach observed switch modules
  tags:
  - modules
  - interfaces
  - cables
  - apply
  - compare
  when: nexus_parent.device is not none
  ansible.builtin.set_fact:
    switch: '{{ (discovered.stdout + [switch_optics_json]) | nexus_inventory }}'
- name: Reconcile serial-bearing installed modules and retained assets
  throttle: 1
  fhs_inventory_sync:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    device: '{{ switch.name }}'
    mode: nexus
    items: '{{ switch.modules | rejectattr("serial", "equalto", "") | list }}'
    complete: false
    scope: '{{ bootstrap_nexus_complete_bays | default(switch.bays) }}'
  register: netbox_write_result
  until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
  retries: '{{ netbox_api_retries }}'
  delay: '{{ netbox_api_retry_delay }}'
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tags:
  - modules
  - apply
  when: nexus_parent.device is not none and not ansible_check_mode and "facts" not in ansible_run_tags and "compare" not in
    ansible_run_tags
- name: Read EPLD firmware report when supported
  cisco.nxos.nxos_command:
    commands: '{{ nexus_epld_command }}'
  register: epld
  check_mode: false
  changed_when: false
  failed_when: false
  when: nexus_epld_command | length > 0
  tags:
  - servers
  - apply
  - compare
- name: Include available EPLD report
  ansible.builtin.set_fact:
    switch: '{{ switch | combine({''custom_fields'': switch.custom_fields | combine({''epld_version'': epld.stdout[0] | trim})})
      }}'
  when:
  - epld.stdout is defined
  - epld.stdout | length > 0
  - epld.stdout[0] | trim | length > 0
  - epld.stdout[0] is not search('(?i)invalid|error|not supported|incomplete|ambiguous')
  tags:
  - servers
  - apply
  - compare
- name: Preview discovered inventory and omissions
  ansible.builtin.debug:
    var: switch
  tags:
  - always
- name: Populate NetBox from discovered switch inventory
  when: nexus_parent.device is not none and not ansible_check_mode and "facts" not in ansible_run_tags and "compare" not in
    ansible_run_tags
  tags:
  - servers
  - apply
  delegate_to: localhost
  connection: local
  become: false
  throttle: 1
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure switch custom fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ item.key }}'
        type: '{{ item.value }}'
        object_types:
        - dcim.device
    loop: '{{ {''os_version'': ''text'', ''operating_system'': ''text'', ''bios_version'': ''text'', ''epld_version'': ''longtext'',
      ''fan_count'': ''integer''} | dict2items }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    loop_control:
      pause: '{{ netbox_api_loop_pause }}'
  - name: Ensure switch identity and versions
    netbox.netbox.netbox_device:
      data:
        name: '{{ switch.name }}'
        site: '{{ nexus_site }}'
        serial: '{{ switch.serial }}'
        custom_fields: '{{ switch.custom_fields }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
- name: Read existing switch LLDP neighbors
  cisco.nxos.nxos_command:
    commands: '{{ nexus_lldp_command | default("show lldp neighbors detail | json") }}'
  register: topology_nexus_lldp
  check_mode: false
  changed_when: false
  failed_when: false
  tags:
  - interfaces
  - cables
  - apply
  when:
  - bootstrap_topology_enabled | default(true) | bool
  - nexus_parent.device is not none
- name: Keep switch topology observations for controller reconciliation
  ansible.builtin.set_fact:
    fhs_topology: '{{ switch.name | fhs_topology_nexus(topology_nexus_lldp.stdout[0] | default("{}"), switch_optics_json |
      default("{}")) }}'
  tags:
  - interfaces
  - cables
  - apply
  when:
  - bootstrap_topology_enabled | default(true) | bool
  - nexus_parent.device is not none
- name: Retain unavailable switch LLDP evidence
  ansible.builtin.set_fact:
    fhs_topology: '{{ fhs_topology | combine({"omissions": fhs_topology.omissions + ["Switch LLDP command failed or returned
      no output"]}) }}'
  when:
  - bootstrap_topology_enabled | default(true) | bool
  - topology_nexus_lldp.failed | default(false) | bool or topology_nexus_lldp.stdout | default([]) | length == 0
  - nexus_parent.device is not none
  tags:
  - interfaces
  - cables
  - apply
- name: Read observed Nexus management interface and address
  cisco.nxos.nxos_command:
    commands: '{{ nexus_management_command }}'
  register: nexus_management
  check_mode: false
  changed_when: false
  failed_when: false
  tags: [interfaces, ips, apply, compare, facts]
- name: Retain optional protected Nexus probe evidence
  ansible.builtin.import_tasks: capture.yml
  vars:
    discovery_raw_captures:
      commands: '{{ nexus_commands }}'
      inventory: '{{ discovered.stdout }}'
      lldp: '{{ topology_nexus_lldp.stdout | default([]) }}'
      management_command: '{{ nexus_management_command }}'
      management: '{{ nexus_management.stdout | default([]) }}'
- name: Write observed switch interfaces without creating cables
  throttle: 1
  tags:
  - interfaces
  - apply
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  when: nexus_parent.device is not none and fhs_topology is defined
  fhs_topology_sync:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    observations: '{{ [fhs_topology | combine({"neighbors": [], "serials": []})] }}'
    preview: '{{ ansible_check_mode or "compare" in ansible_run_tags or "facts" in ansible_run_tags }}'
- name: Reconcile or preview observed Nexus management interface and primary IP
  fhs_nexus_management:
    netbox_url: '{{ netbox_url }}'
    netbox_token: '{{ netbox_token }}'
    validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
    device: '{{ switch.name }}'
    serial: '{{ switch.serial }}'
    output: '{{ nexus_management.stdout[0] if not (nexus_management.failed | default(false)) and nexus_management.stdout | default([]) | length == 1 else "" }}'
    include_ips: '{{ "all" in ansible_run_tags or "ips" in ansible_run_tags or "apply" in ansible_run_tags or "compare" in ansible_run_tags or "facts" in ansible_run_tags }}'
    preview: '{{ ansible_check_mode or "compare" in ansible_run_tags or "facts" in ansible_run_tags }}'
  register: nexus_management_result
  delegate_to: localhost
  connection: local
  become: false
  throttle: 1
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tags: [interfaces, ips, apply, compare, facts]
- name: Report Nexus management observations and preservation diagnostics
  ansible.builtin.debug:
    var: nexus_management_result
  tags: [interfaces, ips, apply, compare, facts]

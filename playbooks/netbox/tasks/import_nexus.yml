- name: Read switch inventory software and every port transceiver
  cisco.nxos.nxos_command:
    commands: '{{ nexus_commands }}'
  register: discovered
  check_mode: false
  changed_when: false
  tags:
  - always
- name: Normalize discovered inventory before any writes
  ansible.builtin.set_fact:
    switch: '{{ discovered.stdout | nexus_inventory }}'
  tags:
  - always
- name: Read EPLD firmware report when supported
  cisco.nxos.nxos_command:
    commands: '{{ nexus_epld_command }}'
  register: epld
  check_mode: false
  changed_when: false
  failed_when: false
  when: nexus_epld_command | length > 0
  tags:
  - always
- name: Include available EPLD report
  ansible.builtin.set_fact:
    switch: '{{ switch | combine({''custom_fields'': switch.custom_fields | combine({''epld_version'': epld.stdout[0] | trim})}) }}'
  when:
  - epld.stdout is defined
  - epld.stdout | length > 0
  - epld.stdout[0] | trim | length > 0
  - epld.stdout[0] is not search('(?i)invalid|error|not supported|incomplete|ambiguous')
  tags:
  - always
- name: Preview discovered inventory and omissions
  ansible.builtin.debug:
    var: switch
  tags:
  - always
- name: Populate NetBox from discovered switch inventory
  when: not ansible_check_mode and 'facts' not in ansible_run_tags and 'compare' not in ansible_run_tags
  tags:
  - apply
  delegate_to: localhost
  connection: local
  become: false
  throttle: 1
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  block:
  - name: Ensure site
    netbox.netbox.netbox_site:
      data:
        name: '{{ nexus_site }}'
        slug: '{{ nexus_site | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure switch role
    netbox.netbox.netbox_device_role:
      data:
        name: '{{ nexus_role }}'
        slug: '{{ nexus_role | lower | regex_replace(''[^a-z0-9]+'', ''-'') | trim(''-'') }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure reported manufacturers
    register: nexus_manufacturers
    until: nexus_manufacturers is succeeded or not (nexus_manufacturers | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    fhs_manufacturers:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      names: '{{ [''Cisco''] + (switch.modules | map(attribute=''manufacturer'') | list) }}'
  - name: Ensure switch type with reported product ID
    netbox.netbox.netbox_device_type:
      data:
        manufacturer: '{{ nexus_manufacturers.manufacturers[''Cisco''] }}'
        model: '{{ switch.model }}'
        part_number: '{{ switch.model }}'
        slug: '{{ switch.model | lower }}'
        u_height: 1
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure switch custom fields
    netbox.netbox.netbox_custom_field:
      data:
        name: '{{ item.key }}'
        type: '{{ item.value }}'
        object_types:
        - dcim.device
    loop: '{{ {''os_version'': ''text'', ''operating_system'': ''text'', ''bios_version'': ''text'', ''epld_version'': ''longtext'', ''fan_count'': ''integer''}
      | dict2items }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    loop_control:
      pause: '{{ netbox_api_loop_pause }}'
  - name: Reconcile switch physical chassis asset
    fhs_inventory_sync:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      device: '{{ switch.name }}'
      mode: device
      serial: '{{ switch.serial }}'
      manufacturer: Cisco
      model: '{{ switch.model }}'
      site: '{{ nexus_site }}'
      role: '{{ nexus_role }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'

  - name: Ensure switch identity and versions
    netbox.netbox.netbox_device:
      data:
        name: '{{ switch.name }}'
        site: '{{ nexus_site }}'
        device_role: '{{ nexus_role }}'
        device_type: '{{ switch.model }}'
        serial: '{{ switch.serial }}'
        custom_fields: '{{ switch.custom_fields }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
  - name: Ensure PSU fan and port module bays
    netbox.netbox.netbox_module_bay:
      data:
        device: '{{ switch.name }}'
        name: '{{ item }}'
    loop: '{{ switch.bays }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    loop_control:
      pause: '{{ netbox_api_loop_pause }}'
  - name: Ensure reported module types
    register: nexus_module_types
    until: nexus_module_types is succeeded or not (nexus_module_types | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'
    fhs_module_types:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      types: '{{ switch.modules | fhs_unique_module_types }}'
      manufacturers: '{{ nexus_manufacturers.manufacturers }}'
  - name: Keep module-type IDs scoped by reported vendor and part
    ansible.builtin.set_fact:
      nexus_module_type_ids: '{{ nexus_module_types.module_types }}'
  - name: Reconcile serial-bearing installed modules and retained assets
    fhs_inventory_sync:
      netbox_url: '{{ netbox_url }}'
      netbox_token: '{{ netbox_token }}'
      validate_certs: '{{ netbox_validate_certs | default(netbox_validate_certs_default) | bool }}'
      device: '{{ switch.name }}'
      mode: nexus
      items: '{{ switch.modules | rejectattr("serial", "equalto", "") | list }}'
      complete: '{{ bootstrap_nexus_complete | default(false) | bool and switch.omissions | length == 0 and switch.modules | selectattr("serial", "equalto", "") | list | length == 0 }}'
      scope: '{{ bootstrap_nexus_complete_bays | default(switch.bays) }}'
    register: netbox_write_result
    until: netbox_write_result is succeeded or not (netbox_write_result | fhs_netbox_transient)
    retries: '{{ netbox_api_retries }}'
    delay: '{{ netbox_api_retry_delay }}'

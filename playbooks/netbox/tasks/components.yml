- name: Discover DDR5 modules
  tags:
  - ddr
  - compare
  - apply
  become: '{{ not (hardware_simulation | default(false) | bool) }}'
  environment:
    PATH: '{{ hardware_command_path }}'
    LC_ALL: C
    LANG: C
  block:
  - name: Read memory device information
    ansible.builtin.command:
      argv:
      - dmidecode
      - --type
      - memory
    register: memory_probe
    changed_when: false
    failed_when: false
    check_mode: false
  - name: Report unavailable memory information
    ansible.builtin.debug:
      msg: 'Memory inventory unavailable; existing NetBox components preserved: {{ memory_probe.stderr | default(memory_probe.msg
        | default(''No diagnostic returned''), true) }}'
    when: memory_probe.rc != 0 or (memory_probe.stdout | default('')) | regex_findall('(?m)^[ \\t]*Memory Device[ \\t\\r]*$')
      | length == 0
  - name: Parse populated DDR5 memory records
    ansible.builtin.set_fact:
      memory_records: '{{ memory_records + [memory_record] }}'
    vars:
      slot: '{{ memory_block | regex_findall(''(?m)^\s*Locator:\s*(.+)$'') | first | default('''') | trim }}'
      bank: '{{ memory_block | regex_findall(''(?m)^\s*Bank Locator:\s*(.+)$'') | first | default('''') | trim }}'
      dmi_handle: '{{ memory_block | regex_findall(''(?m)^\s*Handle\s+(0x[0-9A-Fa-f]+),'') | first | default('''') }}'
      memory_type: '{{ memory_block | regex_findall(''(?m)^\s*Type:\s*(.+)$'') | first | default('''') | trim }}'
      memory_size: '{{ memory_block | regex_findall(''(?m)^\s*Size:\s*(.+)$'') | first | default('''') | trim }}'
      part: '{{ memory_block | regex_findall(''(?m)^\s*Part Number:\s*(.+)$'') | first | default('''') | trim }}'
      component_serial: '{{ memory_block | regex_findall(''(?m)^\s*Serial Number:\s*(.+)$'') | first | default('''') | trim
        }}'
      memory_record:
        slot: '{{ slot if slot | lower not in unavailable_values else ''DMI '' ~ dmi_handle }}'
        bank: '{{ bank }}'
        handle: '{{ dmi_handle }}'
        part: '{{ part if part | lower not in unavailable_values else '''' }}'
        serial: '{{ component_serial if component_serial | lower not in unavailable_values else '''' }}'
    loop: '{{ (memory_probe.stdout | default('''') | replace(''\r'', '''')) | regex_findall(''(?ms)^(?:[ \t]*Handle[^\n]*\n)?[
      \t]*Memory Device[ \t]*\n.*?(?=^[ \t]*Handle|^[ \t]*Memory Device[ \t]*$|\Z)'') }}'
    loop_control:
      loop_var: memory_block
      label: '{{ slot | default(''unknown slot'') }}'
    when: memory_probe.rc == 0 and memory_type | upper == 'DDR5' and memory_size | lower not in ['no module installed', 'unknown',
      '']
  - name: Keep every DDR5 slot distinct
    ansible.builtin.set_fact:
      discovered_components: '{{ discovered_components + [memory_component] }}'
    vars:
      same_slot: '{{ memory_records | selectattr(''slot'', ''equalto'', dimm.slot) | list }}'
      unique_bank: '{{ dimm.bank | lower not in unavailable_values and (same_slot | selectattr(''bank'', ''equalto'', dimm.bank)
        | list | length == 1) }}'
      suffix: '{{ dimm.bank if unique_bank else dimm.handle }}'
      memory_component:
        name: DDR5 {{ dimm.slot }}{{ (' [' ~ suffix ~ ']') if same_slot | length > 1 else '' }}
        kind: DDR5
        part: '{{ dimm.part }}'
        serial: '{{ dimm.serial }}'
    loop: '{{ memory_records }}'
    loop_control:
      loop_var: dimm
      label: '{{ dimm.slot }}'
  rescue:
  - name: Report partial component discovery
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg | default("Missing optional component data; existing records retained") }}'
- name: Write components found so far
  ansible.builtin.import_tasks: items_apply.yml
- name: Discover NVMe drives
  tags:
  - nvme
  - compare
  - apply
  become: '{{ not (hardware_simulation | default(false) | bool) }}'
  environment:
    PATH: '{{ hardware_command_path }}'
    LC_ALL: C
    LANG: C
  block:
  - name: Read NVMe drive list as JSON
    ansible.builtin.command:
      argv:
      - nvme
      - list
      - -o
      - json
    register: nvme_probe
    changed_when: false
    failed_when: false
    check_mode: false
  - name: Report unavailable NVMe information
    ansible.builtin.debug:
      msg: 'NVMe inventory unavailable; existing NetBox components preserved: {{ nvme_probe.stderr | default(nvme_probe.msg
        | default(''No diagnostic returned''), true) }}'
    when: nvme_probe.rc != 0
  - name: Validate NVMe JSON contract before mapping
    ansible.builtin.assert:
      that:
      - (nvme_probe.stdout | from_json).Devices is defined
      - (nvme_probe.stdout | from_json).Devices is sequence
      fail_msg: Expected non-verbose nvme list JSON with a Devices array; review this nvme-cli version before applying.
    when: nvme_probe.rc == 0
  - name: Validate NVMe namespace identifiers
    ansible.builtin.assert:
      that:
      - item.DevicePath is defined
      - item.DevicePath is match('^/dev/nvme[0-9]+n[0-9]+$')
      fail_msg: NVMe JSON schema or namespace path is unsupported; review raw output before applying.
    loop: '{{ (nvme_probe.stdout | from_json).Devices if nvme_probe.rc == 0 else [] }}'
    loop_control:
      label: '{{ item.DevicePath | default(''unsupported record'') }}'
  - name: Record discovered NVMe drives
    ansible.builtin.set_fact:
      discovered_components: '{{ discovered_components + [drive_component] }}'
    vars:
      part: '{{ item.ModelNumber | default('''') | trim }}'
      component_serial: '{{ item.SerialNumber | default('''') | trim }}'
      drive_component:
        name: NVMe {{ item.DevicePath }}
        kind: NVMe
        part: '{{ part if part | lower not in unavailable_values else '''' }}'
        serial: '{{ component_serial if component_serial | lower not in unavailable_values else '''' }}'
    loop: '{{ (nvme_probe.stdout | from_json).Devices | unique(attribute="SerialNumber") if nvme_probe.rc == 0 else [] }}'
    loop_control:
      label: '{{ item.DevicePath }}'
  rescue:
  - name: Report partial component discovery
    ansible.builtin.debug:
      msg: '{{ ansible_failed_result.msg | default("Missing optional component data; existing records retained") }}'
- name: Write components found so far
  ansible.builtin.import_tasks: items_apply.yml
- name: Discover physical NIC modules and their host ports
  ansible.builtin.import_tasks: nic.yml
  tags:
  - nic
  - compare
  - apply
- name: Write discovered NIC cards
  ansible.builtin.import_tasks: nic_apply.yml
- name: Reject component names that would overwrite another discovered component
  tags:
  - ddr
  - nvme
  - nic
  - fpga
  - compare
  - apply
  ansible.builtin.assert:
    that:
    - component_names | length == component_names | unique | length
    - '''DDR5 DMI '' not in component_names'
    fail_msg: Discovered component names collide; provide distinct slot/namespace identifiers before writing NetBox.
  vars:
    component_names: '{{ discovered_components | map(attribute=''name'') | list }}'

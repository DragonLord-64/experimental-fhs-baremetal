---
# Primary provisioning entry point. Each role imported by site.yml has a tag
# matching its role name, allowing exact role selection, for example:
#   ansible-playbook playbooks/provision.yml --tags manage_users,setup_fhs_network

- name: Validate provisioning inputs
  hosts: all
  become: false
  gather_facts: false
  tasks:
    - name: Assert required inventory facts
      ansible.builtin.assert:
        that:
          - inventory_hostname is defined
          - ansible_host is defined
          - sys_mac_address is defined
        fail_msg: "ansible_host and sys_mac_address must be set in host_vars/{{ inventory_hostname }}.yml"

- name: Apply main site.yml
  ansible.builtin.import_playbook: site.yml

- name: Provisioning summary
  hosts: all
  gather_facts: false
  tasks:
    - name: Report
      ansible.builtin.debug:
        msg: "Provisioned {{ inventory_hostname }} — groups: {{ group_names | join(', ') }}"

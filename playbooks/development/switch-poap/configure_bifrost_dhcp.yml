# Run inside Bifrost with your existing NetBox inventory (interfaces: true).
# Supply poap_url; the only optional settings are switch_group and dnsmasq_dir.
# Run for the entire switch group: this replaces the group's shared hosts file.
- name: Configure switch DHCP reservations and POAP bootfile
  hosts: '{{ switch_group | default("device_roles_nexus-switch") }}'
  gather_facts: false
  any_errors_fatal: true
  vars:
    dnsmasq_dir: /etc/dnsmasq.d
    poap_url: "192.168.1.7"
  tasks:
    - name: Select mgmt0 from the NetBox inventory
      ansible.builtin.set_fact:
        management_interfaces: '{{ interfaces | default([]) | selectattr("name", "equalto", "mgmt0") | list }}'

    - name: Require one enabled management interface and a bootfile URL
      ansible.builtin.assert:
        that:
          - management_interfaces | length == 1
          - management_interfaces[0].enabled
          - poap_url is defined
          # - poap_url is match('^https?://[^\s,]+$')
        fail_msg: Enable interfaces in nb_inventory and supply poap_url

    - name: Read its MAC address
      ansible.builtin.set_fact:
        management_mac: '{{ ((management_interfaces[0].primary_mac_address | default({}, true)).mac_address | default(management_interfaces[0].mac_address | default(""), true)) | lower }}'

    - name: Require a valid management MAC address format
      ansible.builtin.assert:
        that:
          - management_mac is match('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
        fail_msg: Set a valid mgmt0 MAC address in NetBox.

    - name: Require unique management MACs across the switch group
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | map('extract', hostvars, 'management_mac') | unique | length == ansible_play_hosts_all | length
        fail_msg: Duplicate MAC addresses detected within this switch group!
      run_once: true

    - name: Update Bifrost DHCP files locally
      delegate_to: localhost
      run_once: true
      become: true
      vars:
        ansible_connection: local
      block:
        - name: Ensure both Bifrost DHCP directories exist
          ansible.builtin.file:
            path: '{{ dnsmasq_dir }}/{{ item }}'
            state: directory
            mode: '0755'
          loop:
            - bifrost.dhcp-hosts.d
            - bifrost.dhcp-opts.d

        - name: Configure each MAC and mark it for POAP
          ansible.builtin.copy:
            dest: '{{ dnsmasq_dir }}/bifrost.dhcp-hosts.d/cisco-poap-host'
            mode: '0644'
            content: |
              {% for switch in ansible_play_hosts_all | sort %}
              {{ hostvars[switch].management_mac }},id:*,set:real-nexus-poap
              {% endfor %}
          notify: Reload dnsmasq DHCP data

        - name: Advertise the shared HTTP script as DHCP option 67
          ansible.builtin.copy:
            dest: '{{ dnsmasq_dir }}/bifrost.dhcp-opts.d/cisco-poap-opts'
            mode: '0644'
            content: |
              tag:real-nexus-poap,66,{{ poap_url }}
              tag:real-nexus-poap,67,poap_script.py
          notify: Reload dnsmasq DHCP data

        - name: Create the static Nexus inventory mapping file for POAP
          ansible.builtin.copy:
            dest: /var/lib/ironic/httpboot/nexus_inventory.yml
            mode: "0644"
            content: |
              ---
              {% for s in ansible_play_hosts_all | sort %}
              {{ hostvars[s].serial }}: {{ hostvars[s].management_interfaces[0].ip_addresses[0].address }}
              {% endfor %}
              ...

        - name: Copy the POAP script to the TFTP boot directory
          ansible.builtin.copy:
            src: poap_script.py
            dest: /var/lib/tftpboot/poap_script.py
            mode: "0755"
          register: poap_script_file

        - name: Automatically fix the POAP script MD5 checksum
          ansible.builtin.command:
            cmd: python3 /var/lib/tftpboot/poap_script.py --checksum
          when: poap_script_file.changed


  handlers:
    # Bifrost container assumption: one dnsmasq service. HUP reloads host/option
    # data, including changed/deleted records, without restarting the service.
    - name: Reload dnsmasq DHCP data
      ansible.builtin.command: pkill -HUP -x dnsmasq
      delegate_to: localhost
      run_once: true
      become: true
      vars:
        ansible_connection: local

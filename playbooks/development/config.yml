---

- name: Validate provisioning inputs
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Assert required inventory facts
      ansible.builtin.assert:
        that:
          - inventory_hostname is defined
          - ansible_host is defined
          - sys_mac_address is defined
        fail_msg: "ansible_host and sys_mac_address must be set in host_vars/{{ inventory_hostname }}.yml"

- name: Configure passwordless sudo
  hosts: all
  become: true
  tasks:
    - name: Enable passwordless sudo for the sudo group
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-passwordless-sudo
        line: "%sudo ALL=(ALL) NOPASSWD:ALL"
        state: present
        mode: "0440"
        create: true
        validate: "/usr/sbin/visudo -cf %s"

# ONLY RUN THESE IF TAG=CONFIG_NODE
- name: Prometheus
  hosts: all
  become: true
  gather_facts: false
  tags: [config_node]
  tasks:
    - name: Install Prometheus
      ansible.builtin.import_role:
        name: manage_prometheus

- name: Prometheus-exporter
  hosts: all
  become: true
  gather_facts: false
  tags: [config_node]
  tasks:
    - name: Install Prometheus-exporters
      ansible.builtin.import_role:
        name: manage_exporter

- name: Provision FHS nodes
  hosts: fhs_nodes
  become: true
  gather_facts: false
  tags: [config_node]
  tasks:
    - name: Apply setup_k8s_node role
      ansible.builtin.import_role:
        name: setup_k8s_node
      tags: [setup_k8s_node]

- name: Provision BIST
  hosts: fhs_nodes
  become: true
  gather_facts: false
  tags: [config_node]
  tasks:
    - name: Apply bist role
      ansible.builtin.import_role:
        name: bist
      tags: [bist]

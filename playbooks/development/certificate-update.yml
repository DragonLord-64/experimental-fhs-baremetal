---
- name: Update CA trust and remove retired controller environments
  hosts: device_roles_fpga-host-server
  become: true
  gather_facts: false
  vars:
    venv_path: /opt/venvs/fhs
    glab_venv_path: /home/gitlab-runner/.bw_venv
  tasks:
    - name: Update system CA certificates
      tags: [update_ca]
      block:
        - name: Update the Ubuntu CA certificate package
          ansible.builtin.apt:
            name: ca-certificates
            state: latest
            update_cache: true

    - name: Verify system CA certificate subjects
      tags: [verify_ca]
      block:
        - name: Decode the system CA bundle before checking certificate subjects
          ansible.builtin.shell: |
            set -o pipefail
            openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt |
              openssl pkcs7 -print_certs -noout
          args:
            executable: /bin/bash
          register: certificate_update_subjects
          changed_when: false

        - name: Require the removed emSign root to be absent from the system bundle
          ansible.builtin.assert:
            that:
              - certificate_update_subjects.stdout | length > 0
              - "'emSign ECC Root CA - G3' not in certificate_update_subjects.stdout"
            success_msg: The removed emSign root is absent from the decoded system CA bundle.

    - name: Remove retired FSP and VCC gRPC services and environments
      tags: [remove_fhs_grpc]
      vars:
        certificate_update_grpc_root: "{{ remove_fhs_grpc_root | default(manage_grpc_root | default('/opt/grpc')) }}"
        certificate_update_grpc_legacy_root: "{{ remove_fhs_grpc_legacy_root | default('/etc/grpc') }}"
        certificate_update_grpc_unit_dir: "{{ remove_fhs_grpc_unit_dir | default('/etc/systemd/system') }}"
        certificate_update_grpc_cache_dir: "{{ remove_fhs_grpc_cache_dir | default('/root/.cache/pypoetry/virtualenvs') }}"
      block:
        - name: Validate gRPC cleanup roots before deletion
          ansible.builtin.assert:
            that:
              - item is string
              - item.startswith('/')
              - item != '/'
              - "'..' not in item.split('/')"
            fail_msg: Supply absolute, non-root cleanup directories without parent traversal.
          loop:
            - "{{ certificate_update_grpc_root }}"
            - "{{ certificate_update_grpc_legacy_root }}"
            - "{{ certificate_update_grpc_unit_dir }}"
            - "{{ certificate_update_grpc_cache_dir }}"

        - name: Inspect installed services before removing gRPC
          ansible.builtin.service_facts:

        - name: Stop and disable the retired FSP and VCC controllers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop: [fsp-grpc.service, vcc-grpc.service]
          when:
            - item in ansible_facts.services
            - ansible_facts.services[item].status | default('') != 'not-found'

        - name: Remove the retired controller service units
          ansible.builtin.file:
            path: "{{ certificate_update_grpc_unit_dir }}/{{ item }}"
            state: absent
          loop: [fsp-grpc.service, vcc-grpc.service]
          register: certificate_update_grpc_units

        - name: Reload systemd after removing controller units
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: certificate_update_grpc_units.changed

        - name: Inspect the root-owned Poetry environment cache
          ansible.builtin.stat:
            path: "{{ certificate_update_grpc_cache_dir }}"
          register: remove_fhs_grpc_cache

        - name: Require a directory for an existing Poetry cache
          ansible.builtin.assert:
            that: not remove_fhs_grpc_cache.stat.exists or remove_fhs_grpc_cache.stat.isdir | default(false)

        - name: Find only the retired controller Poetry environments
          ansible.builtin.find:
            paths: "{{ certificate_update_grpc_cache_dir }}"
            patterns:
              - ska-mid-cbf-fhs-fsp-grpc-controller-*-py*
              - ska-mid-cbf-fhs-vcc-grpc-controller-*-py*
            file_type: directory
            recurse: false
            hidden: true
          register: remove_fhs_grpc_cached_envs
          when: remove_fhs_grpc_cache.stat.exists

        - name: Remove controller installations and their Python environments
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{ [certificate_update_grpc_root ~ '/fsp', certificate_update_grpc_root ~ '/vcc',
                certificate_update_grpc_root ~ '/poetry', certificate_update_grpc_legacy_root ~ '/fsp',
                certificate_update_grpc_legacy_root ~ '/vcc'] +
               (remove_fhs_grpc_cached_envs.files | default([]) | map(attribute='path') | list) }}

    - name: Reset provisioning environments before recreating them
      tags: [reset_venvs]
      block:
        - name: Validate the provisioning venv deletion paths
          ansible.builtin.assert:
            that:
              - item.startswith('/')
              - item.split('/')[-1] in ['fhs', '.bw_venv']
              - "'..' not in item.split('/')"
          loop: "{{ [venv_path, glab_venv_path] }}"

        - name: Remove the provisioning environments before recreating them
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ [venv_path, glab_venv_path] }}"

    - name: Refresh optional Snap packages
      tags: [refresh_snaps]
      block:
        - name: Inspect the optional Snap client
          ansible.builtin.stat:
            path: /usr/bin/snap
          register: certificate_update_snap

        - name: Refresh installed Snap packages
          ansible.builtin.command: /usr/bin/snap refresh
          changed_when: true
          when: certificate_update_snap.stat.exists

    - name: Validate Python certificate trust after cleanup
      tags: [always, audit_python_ca]
      block:
        - name: Run the host Python and CA audit
          ansible.builtin.include_role:
            name: audit_python_ca
            apply:
              tags: [always, audit_python_ca]

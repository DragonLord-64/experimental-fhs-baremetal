---
# requirements.yml
# Install external roles using the following command:
#   ansible-galaxy role install -r requirements.yml -p <path to roles folder>
collections:
  - name: netbox.netbox
    version: 3.23.0

roles:
  - name: ubuntu24_cis
    src: https://github.com/ansible-lockdown/UBUNTU24-CIS.git
    scm: git
    version: 1.6.0  # Or a specific tag/commit like 'v1.0.0'
  - name: geerlingguy.filebeat
    src: geerlingguy.filebeat
    version: "3.7.1" 

    
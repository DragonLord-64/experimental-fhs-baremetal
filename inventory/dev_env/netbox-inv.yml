plugin: netbox.netbox.nb_inventory
# Copy netbox_url from platform-endpoints.yml here.
api_endpoint: http://rmdskadevdu011.mda.ca/mid-cbf-hw/netbox/

interfaces: true
ip_addresses: true

# Configuration settings. See https://docs.ansible.com/projects/ansible/latest/collections/netbox/netbox/nb_inventory_inventory.html#parameters
validate_certs: true
# For an internal CA, install it in controller trust or set ca_path to its PEM bundle.
config_context: true
use_extra_vars: true
flatten_custom_fields: true

fetch_all_builtins: true
modules: true
inventory_items: true

# Formatting to match local inventory style, filtering active device with a primary IP to avoid pulling in other devices.
query_filters:
  - status: "active"
device_query_filters:
  - has_primary_ip: 'true'
group_by:
  - device_roles
# Add this block at the bottom of your NetBox inventory file
groups:
  # Explicit Ubuntu 24 hardening policy membership, independent of device role.
  ubuntu24_cis_production: "'ubuntu24-hardening' in (tags | default([]) | map(attribute='slug') | list)"
  teraboxes: "'fpga-host-server' in (tags | map(attribute='slug') | list) or device_role.slug == 'fpga-host-server'"
  nexus: "'nexus-switch' in (tags | map(attribute='slug') | list) or device_role.slug == 'nexus-switch'"


# Read the shared Vault file before dynamic inventory loads.
token:
  type: Token
  value: "{{ (lookup('ansible.builtin.unvault', lookup('env', 'FHS_PLATFORM_SECRETS_FILE') | default('/provision/files.d/credentials/platform-secrets.yml', true)) | from_yaml).netbox_token }}"

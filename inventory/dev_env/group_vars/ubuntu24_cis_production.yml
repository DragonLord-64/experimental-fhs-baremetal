# Software related defaults that are common to all FHS terabox compute nodes.
# Hardware related defaults should go in the teraboxes.yml inventory file instead.

##############################################################################
# OVERRIDES for UBUNTU24 CIS
# NOTE: the variables listed here are ones that might be toggled to override the defaults, or are ones that are listed as "(MAYBE)" in Ref #2 below. They are not extensive.
# Ref #1: https://github.com/ansible-lockdown/UBUNTU24-CIS/blob/devel/defaults/main.yml for the entire list of defaults.
# Ref #2: https://confluence.skatelescope.org/display/SE/UBUNTU22-CIS+Ansible+Role for System Team's recommended Ubuntu22 CIS settings

## Switching on/off specific baseline sections
# These variables govern whether the tasks of a particular section are to be executed when running the role.
# E.g: If you want to execute the tasks of Section 1 you should set the "_section1" variable
# to "true". If you do not want the tasks from that section to get executed you simply set the variable to "false".
ubtu24cis_section1: true
ubtu24cis_section2: true
ubtu24cis_section3: true
ubtu24cis_section4: false # Firewall work is outside this policy run.
ubtu24cis_section5: true
ubtu24cis_section6: true
ubtu24cis_section7: true

## Reboot system before audit
# System will reboot if false, can give better audit results
skip_reboot: true

# Used for audit
ubtu24cis_level_1: true
ubtu24cis_level_2: false

# Create managed not custom local_facts files
create_benchmark_facts: true
ansible_facts_path: /etc/ansible/facts.d

## Benchmark name used by auditing control role
# The audit variable found at the base
benchmark: UBUNTU24-CIS
## metadata for Audit benchmark
benchmark_version: v1.0.0

# We've defined disruption-high to indicate items that are likely to cause
# disruption in a normal workflow.  These items can be remediated automatically
# but are disabled by default to avoid disruption.
# Value of true runs disruptive tasks, value of false will skip disruptive tasks
ubtu24cis_disruption_high: false

## Unrestricted boot
# Setting this variable to false enables the system to
# boot *without* querying for the bootloader password.
ubtu24cis_ask_passwd_to_boot: false # pragma: allowlist secret

# skip tests that fail in CI/test environments
ubtu24cis_skip_for_test: false

## Root user used
# Root by default is not used unless setup by user
# The role will only run certain commands if set to true
# This allows the ability to skip tasks that may cause an issue
ubtu24cis_uses_root: false # TEMP: for testing environment only. Override to true for production.

###
### Settings for associated Audit role using Goss
###

###########################################
### Goss is required on the remote host ###
### vars/auditd.yml for other settings ###

# Allow audit to setup the requirements including installing git (if option chosen and downloading and adding goss binary to system)
setup_audit: true

# enable audits to run - this runs the audit and get the latest content
run_audit: true
# Run heavy tests - some tests can have more impact on a system enabling these can have greater impact on a system
audit_run_heavy_tests: false
# Ability to limit the number of concurrent processes used by goss (default 50)
audit_max_concurrent: 50

## Only run Audit do not remediate
audit_only: false # Enforcement is intentional.

#############################

# How to retrieve audit binary
# Options are copy or download - detailed settings at the bottom of this file
# you will need access to either github or the file already downloaded
get_audit_binary_method: copy

## if get_audit_binary_method - copy the following needs to be updated for your environment
## it is expected that it will be copied from somewhere accessible to the control node
## e.g copy from ansible control node to remote host
audit_bin_copy_location: "{{ playbook_dir }}/artifacts/goss/goss-v0.4.8"

# how to get audit files onto host options
# options are git/copy/archive/get_url other e.g. if you wish to run from already downloaded conf
audit_content: archive

# If using either archive, copy, get_url:
## Note will work with .tar files - zip will require extra configuration
### If using get_url this is expecting github url in tar.gz format e.g.
### https://github.com/ansible-lockdown/UBUNTU24-CIS-Audit/archive/refs/heads/benchmark-v1.0.0.tar.gz
audit_conf_source: "{{ playbook_dir }}/artifacts/ubuntu24-cis-audit/ubuntu24-cis-audit-benchmark-v1.0.0.tar.gz"

# Destination for the audit content to be placed on managed node
# note may not need full path e.g. /opt with the directory being the {{ benchmark }}-Audit directory
audit_conf_dest: "/opt"

# Where the audit logs are stored
audit_log_dir: "/opt"

## Ability to collect and take audit files moving to a centralized location
# This enables the collection of the files from the host
fetch_audit_output: true

# Method of getting,uploading the summary files
## Ensure access and permissions are available for these to occur.
## options are
# fetch - fetches from server and moves to location on the ansible controller (could be a mount point available to controller)
# copy - copies file to a location available to the managed node
audit_output_collection_method: fetch

# Location to put the audit files
audit_output_destination: "/var/log/ubuntu24_cis_audit_summaries/"

### Goss Settings ##
####### END ########


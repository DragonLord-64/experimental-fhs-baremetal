ubtu24cis_rule_2_2_4: true # (MAYBE) Ensure telnet client is not installed
ubtu24cis_rule_2_2_5: true # (MAYBE) Ensure ldap client is not installed. Unsure if needed by our Ceph nodes. --> I think we want to keep this as true

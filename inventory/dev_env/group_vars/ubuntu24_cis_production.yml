ubtu24cis_rule_1_1_2_1_4: false # Ensure noexec option set
# /var partition
ubtu24cis_rule_1_1_2_4_2: false # Ensure nodev option set
ubtu24cis_rule_1_1_2_4_3: false # Ensure nosuid option set
# 1.2 Package mgmt
# 1.2.2 Configure Package updates
ubtu24cis_rule_1_2_2_1: false # TBD Ensure updates, patches, and additional security software are installed

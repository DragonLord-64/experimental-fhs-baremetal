---
apt_repo_host_name: archive.ubuntu.com
apt_repo_url_base: "http://archive.ubuntu.com"
apt_repo_url: "{{ apt_repo_url_base }}/ubuntu/"
apt_repo_release: noble

# Proposed ingress hostname: create DNS pointing to ingress and a matching TLS certificate.
# LoadBalancer service DNS does not create this dedicated ingress hostname.
pip_index_url: "https://devpi.rmdskadevdu011.mda.ca/root/pypi/+simple/"
pip_trusted_hosts: []
pip_ca_bundle: /etc/ssl/certs/ca-certificates.crt

apt_cache_url: "http://mid-cbf-hw-apt-cacher.hw-management.svc.cluster.local:3142"
git_proxy_url: "http://mid-cbf-hw-git-proxy.hw-management.svc.cluster.local:3128"
git_url_rewrites:
  - target: "https://blocked-by-policy.invalid"
    instead_of: "https://gitlab.com"
  - target: "https://gitlab.com/ska-telescope/"
    instead_of: "https://gitlab.com/ska-telescope/"

---
# Paths inside the provisioning container; RESOURCES_DIR is mounted here.
fhs_resources_dir: /provision/files.d
fhs_archives_dir: "{{ fhs_resources_dir }}/external_archives"
fhs_credentials_dir: "{{ fhs_resources_dir }}/credentials"
fhs_keys_dir: "{{ fhs_resources_dir }}/dev-ssh-keys.d"
# Optional for future internal HTTPS; development HTTP requires no CA files.
# For HTTPS, install controller trust before loading inventory.
platform_ca_certificates: []
# Example: [{src: "{{ fhs_resources_dir }}/certificates/platform-ca.crt", name: platform-ca}]

# Exported platform files on the Ansible controller (secrets may be Vault encrypted).
hwmanage_controller_config: "{{ lookup('hwmanage_config', hwmanage_config_file | default('')) }}"
platform_endpoints_file: "{{ hwmanage_controller_config.platform.endpoints_file }}"
platform_secrets_file: "{{ hwmanage_controller_config.platform.secrets_file }}"
redfish_credentials_file: "{{ hwmanage_controller_config.credentials.bmc_file }}"
platform_endpoints: "{{ lookup('file', platform_endpoints_file) | from_yaml }}"

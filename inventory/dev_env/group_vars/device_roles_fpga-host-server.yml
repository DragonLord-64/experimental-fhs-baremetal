---
# Shared configuration for FHS terabox compute nodes. Keep identity and
# deliberate exceptions in host_vars/<hostname>.yml.

local_dev_user: "terabox1501b"
local_dev_user_pass: "$6$TYxIxZ1emBIXP0r6$vwCBROo9EEyOAyP1cQwTDhDQmfDSH3MnrXmxl0ZZNaOb1WFxZlfVDNz1W0fc/sgK6F8LRCoWpz.F6GxCuCx790"
##############################################################################
# Distribution access
##############################################################################
apt_repo_host_name: archive.ubuntu.com
apt_repo_url_base: "http://archive.ubuntu.com"
apt_repo_url: "{{ apt_repo_url_base }}/ubuntu/"
apt_repo_release: noble

pip_index_url: "http://devpi-svc.dev-mirror.svc.cluster.local:3141/root/pypi/+simple/"
pip_trusted_hosts:
  - "devpi-svc.dev-mirror.svc.cluster.local"

apt_cache_url: "http://apt-cacher-svc.dev-mirror.svc.cluster.local:3142"
git_proxy_url: "http://skao-git-proxy-svc.dev-mirror.svc.cluster.local:3128"
git_url_rewrites:
  - target: "https://blocked-by-policy.invalid"
    instead_of: "https://gitlab.com"
  - target: "https://gitlab.com/ska-telescope/"
    instead_of: "https://gitlab.com/ska-telescope/"

##############################################################################
# Monitoring
##############################################################################
manage_exporters_exporter_file: "/provision/files.d/external_archives/ska-mid-cbf-fhs-prometheus-exporter-0.0.5-rc3.tar.gz"
manage_prometheus_prometheus_tar: "prometheus-3.12.0.linux-amd64"
manage_prometheus_node_tar: "node_exporter-1.11.1.linux-amd64"
manage_prometheus_enable_auth: true
manage_prometheus_user_cred: $2b$12$nk3YaT9.oGhFHSFA084eWeai85B0TjTujC7fZSD9ktAOheOxfiWTO

##############################################################################
# Kubernetes
##############################################################################
k8s_taints:
  - key: "node-type"
    value: "fhs-worker"
    effect: "NoSchedule"

##############################################################################
# User environment and BittWare SDK
##############################################################################
venvs:
  - path: /opt/venvs/fhs
    python: /usr/bin/python3
    owner: ubuntu
    group: bittware
    packages:
      - pip
      - setuptools
      - wheel
  - path: /home/ubuntu/.bw_venv
    python: /usr/bin/python3
    owner: ubuntu
    group: ubuntu
    packages:
      - pip
      - setuptools
      - wheel

users_setup_venvs: true
fpga_bittware_sdk_deb: "/provision/files.d/external_archives/bittware-sdk-ubuntu24.04-2026.1.0.deb"
fpga_update_bittware_sdk: true


##############################################################################
# DPDK, Arkville, and DOCA
##############################################################################
dpdk_local_path: "/provision/files.d/"
dpdk_tarball_filename: "dpdk.tar.gz"

arkville_release: "25.11"
arkville_local_path: "/provision/files.d/arkville/archive"

doca_local_path: "/provision/files.d/"
doca_deb_filename: "doca-host_3.3.0-088000-26.01-ubuntu2404_amd64.deb"

##############################################################################
# FPGA host configuration
##############################################################################
fpga_packages:
  - dkms
  - linux-modules-extra-{{ ansible_kernel }}

fpga_kernel_cmdline:
  - iommu=pt
  - amd_iommu=on
  - hugepages=8

fpga_update_grub: true
fpga_update_bmc: true
fpga_bmc_firmware_version: 1.3.16
fpga_bmc_firmware_zip: "/provision/files.d/external_archives/bmc30-1.3.1_6.zip"

# Standard BIST device names and PCI layout. Override these in host_vars only
# when a server's physical card layout intentionally differs.
nvme0_device_name: "nvme0n1"
nvme1_device_name: "nvme1n1"
nvme0_bdf: "84:00.0"
nvme1_bdf: "86:00.0"

fpga_card0_bdf_detri: "81:00.1"
fpga_card1_bdf_detri: "c1:00.1"
fpga_card0_bdf_ark: "81:00.0"
fpga_card1_bdf_ark: "c1:00.0"
terabox_nic0_bdf: "01:00.0"





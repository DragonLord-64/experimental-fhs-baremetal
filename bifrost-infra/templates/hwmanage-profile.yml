---
# Shared NetBox config context, or merge into native Bifrost group_vars/baremetal.
# Replace reserved example addresses and checksum before deployment.
driver: redfish
boot_interface: ipxe
driver_interfaces:
  raid: none
ipv4_subnet_mask: 255.255.255.0
ipv4_nameserver: 192.0.2.53
ipv4_gateway: 192.0.2.1
instance_info:
  image_source: http://192.0.2.10:8080/approved-image.qcow2
  image_checksum: REPLACE_WITH_VERIFIED_CHECKSUM
  capabilities:
    boot_mode: uefi
properties:
  root_device:
    name: REPLACE_WITH_REVIEWED_ROOT_DISK_DEVICE

---
# Explicit fallback: hwmanage provision -i /provision/files.d/nodes.yml --limit example-node
# Native Bifrost mapping. Supply protected credentials separately via Vault.
example-node:
  name: example-node
  driver: redfish
  boot_interface: ipxe
  driver_interfaces:
    raid: none
  driver_info:
    redfish_address: https://192.0.2.20
    redfish_system_id: /redfish/v1/Systems/1
    redfish_verify_ca: true
  nics:
    - mac: '02:00:00:00:00:01'
  sys_mac_address: '02:00:00:00:00:01'
  ipv4_address: 192.0.2.30
  ipv4_subnet_mask: 255.255.255.0
  ipv4_nameserver: 192.0.2.53
  ansible_user: ubuntu
  host_groups: [device_roles_fpga-host-server]
  instance_info:
    image_source: http://192.0.2.10:8080/approved-image.qcow2
    image_checksum: REPLACE_WITH_VERIFIED_CHECKSUM
    capabilities:
      boot_mode: uefi
  properties:
    root_device:
      name: REPLACE_WITH_REVIEWED_ROOT_DISK_DEVICE
